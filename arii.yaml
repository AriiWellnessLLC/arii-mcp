openapi: 3.0.3
info:
  title: Arii Health Platform API
  version: "3.1.0"
  x-mcp-tool-prefix: Arii_MCP
  description: |
    Arii is a health and wellness platform for patient data, clinical notes, observations,
    medications and supplements, journaling, meals, and symptoms.

    Every operation, parameter and behaviour described here is verified against merged
    `arii-api` `main` (398859a13, 18 September 2026). Nothing is exposed that is not merged,
    and where the API's own XML docs disagree with its behaviour the behaviour is what is
    documented here.

    ## LLM Agent Usage Guide

    **Primary workflows:**
    - Any question about a patient's markers: `get_user_marker_types_with_data` first, to
      see what this person actually has. Then whichever read the question calls for, scoped
      to those ids with `specificMarkers` — `get_marker_summary_compact` for current values,
      `get_marker_averages_compact` for a trend, `get_marker_samples_compact` for individual
      readings, `get_observation_samples` for whether a result is normal for this person.
      Never fetch observation sample payloads for values.
    - **The three compact marker reads return every source**, one row per source, the
      person's preferred source first, each naming its `dataSourceName`. The app shows one
      source per marker; these do not. A marker the preferred source has nothing for still
      comes back from the source that has it (AIP-350).
    - "Is she hitting her target?" is `get_marker_averages_compact`, scoped with
      `specificMarkers` to the markers the question names: each row carries `goal`, `goalGap`
      and the days that met it. Do not look for a separate goal tool.
    - An open question with no named marker — "how am I doing", "give me a snapshot",
      "what do you have for me" — goes straight to `get_marker_summary_compact` with
      `select=Abnormal`. It answers over the whole window in a handful of rows.
    - `bulk_search_marker_types` when nothing in that list matches the wording, to check
      whether the catalog knows the metric at all. It reads the global catalog, so a hit
      there never means this patient has it.
    - "Flag anything out of range" / "which labs are abnormal": `get_out_of_range_results`.
      It flags each result `L` or `H` on the server and names the range's source and the
      draw date. Band labels on `get_observation_samples` (`segments[].label`) are alert
      levels, not directions: never report a result as low or high from a label.
    - "Is this normal for this person?": for one named result, `get_observation_samples`,
      which carries `appliedReferenceRange` — patient-specific, sex-filtered, converted to
      the sample's unit. Across the whole chart, `get_marker_summary_compact` with
      `select=Abnormal`, whose rows carry `rangeStatus` and `outOfRange`. Every compact row
      carries `referenceRange`: on `get_marker_summary_compact` the range the row was judged
      against, on `get_marker_averages_compact` the range on that source's newest reading in
      the window, and on `get_marker_samples_compact` the range printed with the reading.
    - Lab draw metadata (when was the last panel, observation id): `list_observations`
      with `Type=Lab` and **`IncludeHealthKitSamples=false` only**.
    - Device metrics (steps, HR, sleep): marker tools, scoped to the ids from
      `get_user_marker_types_with_data`.
    - Medications and supplements: `get_active_medications_and_supplements` for what
      someone takes now, `get_all_medications_and_supplements` for history,
      `get_dose_history` for dose-by-dose adherence, `get_adherence_stats` for the
      summary figure.
    - Clinical notes: `list_notes` / `get_note` (providers) or `get_shared_notes`
      (patients).
    - Profile facts (date of birth, sex, timezone, allergies): `get_user_preferences`.
      They are not on `get_user`.

    **This surface is read-only.** No `create_*` tool is exposed. The app writes the
    record when the person approves a card in the client; an agent writing directly
    creates a row nobody approved, and the approval then saves a duplicate.

    **CRITICAL - User ID kinds (do not confuse these):**
    - **Arii user ID** (`UserDto.id` / `CurrentUserIdentityDto.id`): the internal Arii GUID
      used in path/query params (`userId`, `requestingUserId`, `SelectedUserId`,
      `RequestingUserId`, etc.). Under Bearer/passthrough, obtain it via `get_current_user`.
    - **Airia profile ID** (`airiaProfileId`): the Airia Platform profile GUID.
      Correlation only. It is **not** a valid Arii `userId`. Passing it as `userId`
      returns 404 ("No user found") under Bearer auth.
    - **Keycloak / IdP `sub`**: never an Arii `userId`.
    - **Active group ID** (`activeGroupId`): organization/practice GUID, not a user ID.

    **`get_current_user` returns the person asking, never the person whose data this is.**
    Do not use its `id` as the `userId` of a patient data read: on a clinician's turn that
    reads the clinician's own empty record, and the answer comes out as the patient having
    no data. Whose data to read comes from the execution context. Call `get_current_user`
    when the question is about the requester themselves, or to check whether the session has
    a linked Arii account at all. Under Bearer/passthrough no read in this catalog needs
    `requestingUserId`; on the legacy `X-API-Key` path it is still the caller's identity and
    omitting it is refused.

    **Common workflows:**
    - "Provider reading a patient" -> path `userId` = patient Arii ID from execution
      context. Nothing else is needed: the session identifies the caller, `requestingUserId`
      is discarded, and no header is available to a tool call.
    - "How are my lipids / cholesterol / LDL / HDL / triglycerides?" ->
      `get_user_marker_types_with_data` -> keep the rows whose name or aliases match the
      lipid panel -> `get_marker_summary_compact` with those ids in `specificMarkers`. Do
      **not** call `list_observations` or `get_observation` with samples enabled.
      To work by category instead of by name, call `get_marker_summary_compact` unfiltered
      and read `categoryFacets` for the `categoryId` — that is the only category filter in
      this catalog that keys off a name you can read. The `category` on
      `get_user_marker_types_with_data` and on `list_marker_types` is a numeric id.
    - "When was my last lab draw / which observation id?" -> `list_observations`
      (`Type=Lab`, **`IncludeHealthKitSamples=false`**). Sort by `date` descending.
      Bound it with `RecordStartDate`/`RecordEndDate` as `yyyy-MM-dd`; either can be sent
      alone. `StartDate`/`EndDate` on this tool are deprecated instants that must carry a
      trailing `Z` or the API returns 400 — prefer the record-date pair.
    - "Device / daily metrics (steps, HR, sleep)" -> marker tools
      (`get_marker_summary_compact`, `get_marker_samples_compact`, `get_marker_averages_compact`).

    **Authentication:** JWT Bearer tokens (passthrough from Airia Platform) and API Key
    via `X-API-Key`.
    - Under **Bearer / passthrough**, you MUST pass Arii user IDs. There is no automatic
      translation from Airia profile ID to Arii user ID. No read here needs
      `requestingUserId`, so `get_current_user` is for questions about the requester
      themselves, not a step before a patient read.
    - Under **API Key**, `requestingUserId` is the only identity the API has, and the older
      reads that take it refuse the call without one (400 on `get_user_symptom_details`).
      The three compact marker reads
      (`get_marker_summary_compact`, `get_marker_averages_compact`,
      `get_marker_samples_compact`) are **Bearer only**: under API Key they return 401, and
      `requestingUserId` is deprecated and ignored on them. The "omit it" guidance on those
      tools is for Bearer/passthrough.
    - Airia profile ID to Arii user ID auto-translation exists **only for API Key auth**,
      and some newer endpoints do not support API Key at all.

    **Cross-user access.** Cross-user reads depend on family, sharing, or group
    permissions, and the API resolves them from who is asking. **No header is available
    to a tool call** — a tool call is a set of arguments matching a declared schema, and
    no operation here declares a header, so there is nothing an agent can send to widen
    its access. A clinic-only link may therefore be refused. Refusal shapes are currently
    inconsistent across endpoints (403, 400, and prose that reads like emptiness); a
    refusal is an access problem, never evidence that the person has no data. Tracked as
    AIP-233.

    **Share windows.** When access comes from a personal share rather than self or group,
    the start date of a dated read may be narrowed to the share's own window. The response
    does not say it happened. Read the dates that come back before describing the period
    you covered.

    **Pagination:** 0-based `pageNumber` and `pageSize`. Page sizes and defaults differ per
    tool and are stated on each. The three compact marker reads are not paged: they are
    bounded by their scope, and `get_marker_samples_compact` says `truncated` when it cuts.

    **Dates.** `recordStartDate`/`recordEndDate` are patient-local calendar days
    (`YYYY-MM-DD`). Journals and symptoms take this pair too; prefer it there. `startDate`/
    `endDate` are instants, but on journals, symptoms and dose history a plain calendar day
    is accepted too and covers the whole of that day in UTC, not in the patient's timezone;
    on observations it still returns 400 without a trailing `Z` (`2026-08-28T00:00:00Z`).
    Each tool states which it takes.

    **Errors:** `get_current_user` returns 401 if unauthenticated and 404 if the JWT has
    no linked Arii user. Wrong ID kind (Airia profile ID / Keycloak `sub` as `userId`)
    returns 404 under Bearer/passthrough.

    **IDs:** All entity IDs are GUIDs (e.g., `3fa85f64-5717-4562-b3fc-2c963f66afa6`).

servers:
  - url: https://dev.api.nicoya.health
    description: Nicoya dev environment (override per environment via ?u= on the gateway URL)

security:
  - apiKeyAuth: []
  - bearerAuth: []

tags:
  - name: Users
    description: |
      User identity and profile. `get_current_user` returns the caller; `get_user` and
      `get_user_preferences` return a named user's account record and profile facts.
  - name: Journal
    description: Patient wellness journal entries
  - name: Meals
    description: Meal and nutrition tracking
  - name: Medications
    description: |
      Medications and supplements, read from the user-products store: what someone takes
      now, everything they have taken, dose-by-dose adherence, and the adherence summary.
  - name: Notes
    description: Clinical and provider notes for patients
  - name: Observations
    description: Health observations (labs, activities, assessments, appointments, and summaries)
  - name: Documents
    description: Health documents with AI-powered feature extraction
  - name: Symptoms
    description: Symptom tracking and reporting
  - name: Markers
    description: Health marker values, trends and individual readings from every source, one row per marker and source
  - name: MarkerTypes
    description: Marker type (biomarker/metric) definitions and lookup
  - name: DataDictionary
    description: Per-user data dictionary (which marker types a user has data for)

paths:
  # ===================
  # USER ENDPOINTS
  # ===================
  /api/v1/Users/me:
    get:
      tags: [Users]
      operationId: get_current_user
      summary: Get the authenticated caller's Arii identity
      description: |
        Returns the person making the request: their Arii user ID, profile ID, email,
        name, and active group.

        Use when the question is about the requester themselves or when you need to
        determine whether the current session has a linked Arii account. It is not a step
        before reading a patient's data: no tool here needs `requestingUserId`.

        Do not use the returned ID as the `userId` for a patient data read. For a
        clinician, this would read the clinician's own record instead of the patient.

        A 404 means the session has no linked Arii account.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      responses:
        "200":
          description: Authenticated caller's Arii identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserIdentityDto"
        "401":
          description: Missing or invalid Bearer token
        "404":
          description: Valid token but no linked Arii user, or linked user row missing

  /api/v1/Users/{userId}:
    get:
      tags: [Users]
      operationId: get_user
      summary: Get a user by Arii user ID
      description: |
        Returns basic identity information for a user: name, email, Airia profile ID,
        active group, profile image (in `imageBase64`, which holds a URL), and the last
        Apple Health sync timestamp.

        Use to confirm a user's name or email from a known user ID, or to check whether
        Apple Health is still feeding data — a stale sync timestamp explains missing
        recent readings better than any marker read can.

        No other connector's sync time is here. `lastGarminSyncTimestamp` and
        `lastHealthConnectSyncTimestamp` are on the response and are always null, and no
        tool in this catalog reports when Garmin, Withings, Oura or any other connector
        last synced.

        Does not return date of birth, sex, timezone, or allergies. Use
        `get_user_preferences` for those.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"

  /api/v3/UserPreferences/{userId}:
    get:
      tags: [Users]
      operationId: get_user_preferences
      summary: Get a user's profile information
      description: |
        Returns a user's profile information: date of birth, sex, timezone, height,
        weight, allergies, dietary preferences, and goals.

        Use for profile information, not measured health data.

        For permitted cross-user reads, fields may be filtered by the requester's
        permissions. A missing field may therefore be hidden rather than unset — never
        report it as "not recorded".

        If no timezone was selected, `timeZoneIdentifier` defaults to `America/New_York`.
        Treat this as a default, not a user preference.

        If this read fails, say you could not retrieve the data. A failure is never
        evidence that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
      responses:
        "200":
          description: User preferences (profile facts)
        "403":
          description: Requester is not permitted to read this user's preferences
        "404":
          description: No preferences record for this user

  # ===================
  # JOURNAL ENDPOINTS
  # ===================
  /api/v1/Journal/{userId}:
    get:
      tags: [Journal]
      operationId: get_user_journals
      summary: Get journal entries for a user
      description: |
        Returns journal entries written by a user over a date range.

        Use for the user's own written account of how they were feeling or what they
        experienced, not for measured health data.

        Use `recordStartDate` and `recordEndDate` together as `yyyy-MM-dd`. They are the
        patient's own calendar days, and the end day is covered in full. Sending only one of
        them returns 400. The pair takes priority over `date`, `startDate` and `endDate`.

        `startDate` and `endDate` are the older form. A plain calendar day such as
        `2026-08-28` is read as a UTC day, so for a patient outside UTC it can miss or add
        entries near midnight. A UTC instant such as `2026-08-28T00:00:00Z` is used exactly
        as sent.

        When no entries match, this returns 404 with a message, not an empty list. Read
        that as no entries for the filter, not as an error.

        Treat journal content as the user's account; it may differ from measured health
        data.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: recordStartDate
          in: query
          description: Patient local calendar start day (YYYY-MM-DD). Send together with recordEndDate.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          description: Patient local calendar end day (YYYY-MM-DD), covered in full. Send together with recordStartDate.
          schema:
            type: string
            format: date
        - name: date
          in: query
          description: Filter a single UTC day, as `2026-08-28`. A UTC instant is also accepted. Prefer the record-date pair.
          schema:
            type: string
            format: date-time
        - name: startDate
          in: query
          description: Older form. Window start, as a UTC day `2026-08-28` or a UTC instant with a trailing `Z`. Prefer the record-date pair.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Older form. Window end, as a UTC day `2026-08-28` — the whole day is covered — or a UTC instant with a trailing `Z`. Prefer the record-date pair.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalDto"
        "404":
          description: No entries matched the filter. Not an error.

  /api/v1/Journal/journal/{journalId}:
    get:
      tags: [Journal]
      operationId: get_journal
      summary: Get a journal entry by ID
      description: |
        Returns one journal entry in full, including its body text.

        Use only with a journal ID returned by `get_user_journals`.

        Use when the user asks about a specific journal entry already identified.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: journalId
          in: path
          required: true
          description: The journal entry ID (GUID), from `get_user_journals`. Never assembled.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Journal entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalDto"

  # ===================
  # MEAL ENDPOINTS
  # ===================
  /api/v1/Meals/{userId}:
    get:
      tags: [Meals]
      operationId: get_user_meals
      summary: Get all meals for a user
      description: |
        Returns meals recorded by a user over a date range, including their attached
        nutrition data.

        Nutrition arrives in `healthKitSamples`. Each entry carries `quantityTypeName`
        (`TotalFats`, `DietaryFiber`, `DietaryProtein`, …) — read that. The integer
        `quantityType` beside it is the same value (1 carbohydrates, 3 energy, 4 fibre,
        5 protein, 6 sodium, 7 total fat, 13 sugar) and is only for clients that predate
        the name. Never infer a nutrient from the order entries arrive in: fibre and total
        fat, and carbohydrates and protein, are easy to transpose and the reply gives the
        reader no way to notice.

        Use `recordStartDate` and `recordEndDate` together as `yyyy-MM-dd`.

        When no meals match, this returns 404 with a message, not an empty list. That is
        the tool saying it found no records for the filter — it is not an error, and it
        does not mean the person did not eat. Dietary marker data can exist without meal
        records.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: recordStartDate
          in: query
          description: Patient local calendar start day (YYYY-MM-DD). Send together with recordEndDate.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          description: Patient local calendar end day (YYYY-MM-DD). Send together with recordStartDate.
          schema:
            type: string
            format: date
        - name: date
          in: query
          description: Filter by specific date (ISO 8601). Prefer the record-date pair.
          schema:
            type: string
            format: date-time
        - name: startDate
          in: query
          description: Filter start date (ISO 8601). Prefer the record-date pair.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter end date (ISO 8601). Prefer the record-date pair.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealDto"
        "404":
          description: No meals matched the filter. Not an error, and not proof the person did not eat.

  /api/v1/Meals/meal/{mealId}:
    get:
      tags: [Meals]
      operationId: get_meal
      summary: Get a specific meal by ID
      description: |
        Returns one meal in full, including its complete nutrition breakdown in
        `healthKitSamples`. Read each entry's `quantityTypeName` (`TotalFats`,
        `DietaryFiber`, `DietaryProtein`, …); the integer `quantityType` beside it is the
        same value and is only for clients that predate the name.

        Use only with a meal ID returned by `get_user_meals`.

        Use when the user asks about a specific meal already identified in the
        conversation.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: mealId
          in: path
          required: true
          description: The meal ID (GUID), from `get_user_meals`. Never assembled.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Meal details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealDto"

  # ===================
  # MEDICATION AND SUPPLEMENT ENDPOINTS (user-products)
  # ===================
  /api/v1/user-products/user/{userId}/active:
    get:
      tags: [Medications]
      operationId: get_active_medications_and_supplements
      summary: Get what a person is currently taking
      description: |
        Returns what a person is currently taking — medications and supplements together
        — one row per item, including display name, form, strength, dose quantity,
        schedule, instructions, and today's dose logs.

        Use for the current medication or supplement list.

        `type` is optional. Omit it for both categories, or pass `Medication` or
        `Supplement` for one. Omitting it does not default to medications.

        Returns only items active today. An item that is on hold, completed or stopped,
        or whose schedule has not started or has already ended, is not returned.

        Strength is `strengthValue` with `strengthUnitCode`, a free-text unit code that
        can carry a concentration such as `mg/mL`. Always report the two together.

        `todayHistory` holds today's dose logs for the item. An empty `todayHistory` does
        not mean nothing was scheduled: a day's logs exist only once the prescription was
        created or updated, so today's rows may not have been created yet.

        For whether a dose was taken on an earlier day, use `get_dose_history`.

        If this read fails, say you could not retrieve the data. A failure is never
        evidence that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: type
          in: query
          description: |
            Optional product type. Omit for both categories; pass `Medication` or
            `Supplement` for one. Omitting does not default to medications.
          schema:
            type: string
            enum: [Medication, Supplement]
      responses:
        "200":
          description: Active prescriptions for the user
        "403":
          description: Requester is not permitted to read this user's prescriptions

  /api/v1/user-products/user/{userId}/prescriptions:
    get:
      tags: [Medications]
      operationId: get_all_medications_and_supplements
      summary: Get every medication or supplement on a person's record, current and past
      description: |
        Returns every medication or supplement on a person's record, current and past,
        whatever its status — `Active`, `OnHold`, `Completed`, `Stopped`, `Superseded`
        or `EnteredInError` — with `deactivatedAt` for anything no longer in use.

        Use for what someone used to take, when they stopped, or whether they have been
        on a drug before. For what they are taking now, use
        `get_active_medications_and_supplements`.

        `type` must always be sent. It accepts `Medication` or `Supplement`, and omitting
        it returns medications only, with a 200 and nothing saying supplements were left
        out. Call the tool twice when both categories are needed.

        Read `status` on every row. This tool returns discontinued and mistakenly entered
        items alongside current ones, so presenting the rows as a medication list would
        overstate what the person takes.

        If this read fails, say you could not retrieve the data. A failure is never
        evidence that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: type
          in: query
          required: true
          description: |
            Product type. Always send it: an absent value binds to `Medication` and
            silently drops supplements with a 200. Call twice for both categories.
          schema:
            type: string
            enum: [Medication, Supplement]
      responses:
        "200":
          description: All prescriptions of that type, whatever their status
        "403":
          description: Requester is not permitted to read this user's prescriptions

  /api/v1/user-products/user/{userId}/history:
    get:
      tags: [Medications]
      operationId: get_dose_history
      summary: Get dose-by-dose medication and supplement adherence
      description: |
        Returns the individual scheduled doses of a person's medications and supplements,
        grouped by the day each dose was scheduled for, with its status: `Pending`,
        `Taken`, `Skipped`, or `Missed`.

        Use for medication or supplement adherence, and to determine whether a dose was
        taken.

        This is not the current medication list. Use
        `get_active_medications_and_supplements` for that.

        `type` is optional. Omit it for both categories, or pass `Medication` or
        `Supplement` for one.

        Always send `startDate`. Without it the response reaches back to the person's
        first dose. `endDate` defaults to today in the person's own timezone.

        Always send `pageSize`, normally 50. A page holds at most that many doses, newest
        scheduled dose first. `pageNumber` is 0-based. When `hasNextPage` is `true`, more
        doses exist in the window; ask for the next page only if the question needs
        older doses. For counts and adherence rates, use `get_adherence_stats` instead
        of paging through every dose.

        `dateFilterBy` defaults to `ScheduledDate`, which keeps each dose in the day it
        was due. Pass `EffectiveDate` to window taken doses by when they were actually
        taken instead.

        `yyyy-MM-dd` works on both axes, and the end day is covered in full. A UTC instant
        such as `2026-08-28T00:00:00Z` is also accepted and is used exactly as sent.

        `Pending` means a dose is still due and `Missed` means it is past its grace
        period. The endpoint reconciles the two before answering, so both can be reported
        as read.

        If this read fails, say you could not retrieve the data. A failure is never
        evidence that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: type
          in: query
          description: Optional product type. Omit for both categories.
          schema:
            type: string
            enum: [Medication, Supplement]
        - name: startDate
          in: query
          required: true
          description: |
            Window start. A plain `2026-08-28`, or a UTC instant with a trailing `Z`.
          schema:
            type: string
        - name: endDate
          in: query
          description: Window end, as `2026-08-28` — the whole day is covered — or a UTC instant with a trailing `Z`. Defaults to today in the person's own timezone.
          schema:
            type: string
        - name: status
          in: query
          description: Optional adherence status filter.
          schema:
            type: string
            enum: [Pending, Taken, Skipped, Missed]
        - name: dateFilterBy
          in: query
          description: |
            Which date the window applies to. `ScheduledDate` (default) keeps each dose in
            the day it was due; `EffectiveDate` windows taken doses by when they were
            actually taken.
          schema:
            type: string
            enum: [ScheduledDate, EffectiveDate]
            default: ScheduledDate
        - name: pageSize
          in: query
          required: true
          description: Doses per page, 1-100. Send 50 unless the question needs fewer.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: pageNumber
          in: query
          description: Page number (0-based, default 0). Sent only with `pageSize`.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Dose history grouped by scheduled day, newest first, with `hasNextPage`
        "400":
          description: pageSize is outside 1-100, or pageNumber is negative
        "403":
          description: Requester is not permitted to read this user's adherence history

  /api/v1/user-products/user/{userId}/adherence-stats:
    get:
      tags: [Medications]
      operationId: get_adherence_stats
      summary: Get a person's dose counts by outcome and adherence rate
      description: |
        Returns counts of a person's doses by outcome — `total`, `taken`, `skipped`,
        `missed` and `pending` — plus `adherenceRate` as a percentage.

        Use when the question is how well someone is keeping to their doses, rather than
        reading every dose through `get_dose_history` and counting them.

        `type` is optional. Omit it for one figure covering medications and supplements
        combined, or pass `Medication` or `Supplement` for a single category.

        `startDate` and `endDate` are both optional and neither is defaulted. The window
        applies to the day each dose was scheduled for. Send both whenever the question is
        about a period ("this month", "since starting X"); send neither only when the
        question is about the person's whole history, because that is what you get back.

        Omitting `endDate` leaves the window open-ended, so doses that are not yet due are
        counted as well. Those land in `pending`.

        `adherenceRate` is `taken` divided by `total` minus `pending`. It is reported as 0
        when nothing in the window has resolved yet, so check `total` and `pending` before
        describing a rate of 0 as poor adherence.

        A skipped dose counts against the rate exactly as a missed one does, even though
        the person chose to skip it.

        If this read fails, say you could not retrieve the data. A failure is never
        evidence that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: type
          in: query
          description: Optional product type. Omit for one combined figure across both categories.
          schema:
            type: string
            enum: [Medication, Supplement]
        - name: startDate
          in: query
          description: Window start. Optional. Send it with `endDate` to scope the counts to a period; with neither date the counts cover the whole history.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Window end. Optional and not defaulted — omitting it leaves the window open-ended and counts doses that are not yet due as `pending`.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Adherence counts and rate
        "403":
          description: Requester is not permitted to read this user's adherence stats

  # ===================
  # NOTE ENDPOINTS
  # ===================
  /api/v1/Notes:
    get:
      tags: [Notes]
      operationId: list_notes
      summary: List notes with pagination and filters
      description: |
        Returns clinical notes for a provider.

        Use `patientId` to scope the results to a specific patient. Without it, the tool
        may return notes across the tenant and the results may belong to unrelated
        patients.

        Patients should use `get_shared_notes` instead.

        `pageNumber` is 0-based and `pageSize` is 1-100, default 20. Outside that range
        returns 400.

        This is the v1 shape, where a note's `date` is a full timestamp. The v2 route
        returns the same fields with `date` as a calendar day; the catalog stays on v1
        deliberately so the tool contract does not change under agents mid-flight.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: pageNumber
          in: query
          description: Page number (0-based, default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Page size (1-100, default 20).
          schema:
            type: integer
            default: 20
        - name: includeDrafts
          in: query
          description: Include draft notes (default true).
          schema:
            type: boolean
            default: true
        - name: createdBy
          in: query
          description: Filter by creator user ID (GUID).
          schema:
            type: string
            format: uuid
        - name: patientId
          in: query
          description: |
            The patient's Arii user ID (`UserDto.id` GUID) — not an Airia profile ID.
            **Always set this.** Without it the call reaches across the tenant.
          schema:
            type: string
            format: uuid
        - name: isPrivate
          in: query
          description: Filter by the note's private flag. Omit to return both private and non-private notes.
          schema:
            type: boolean
        - name: isArchived
          in: query
          description: Filter by archived status.
          schema:
            type: boolean
        - name: search
          in: query
          description: Search text to filter by title or content.
          schema:
            type: string
        - name: categories
          in: query
          description: Filter by category names (comma-separated). Exact strings come from `list_note_categories`.
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Paginated notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedNotes"

  /api/v1/Notes/shared:
    get:
      tags: [Notes]
      operationId: get_shared_notes
      summary: Get notes shared with the current user
      description: |
        Returns clinical notes that a clinician has shared with the patient.

        Use for the patient-side view of shared clinical notes.

        Private and archived notes are excluded.

        Each note carries `sharedBy`, `sharedAt` and `sharer` — who shared it and when —
        alongside `creator`, `version` and `hasDraft`.

        Returns a plain list, not a page. There is no `pageNumber`.

        An empty result means no notes were shared with the patient. It does not mean the
        patient's chart contains no notes.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: query
          description: |
            Arii user ID (`UserDto.id` GUID) whose shared notes to fetch — not an Airia
            profile ID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of shared notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteDto"

  /api/v1/Notes/{id}:
    get:
      tags: [Notes]
      operationId: get_note
      summary: Get a note by ID
      description: |
        Returns one clinical note in full, including its body, category, and sharing
        state.

        Use only with a note ID returned by `list_notes` or `get_shared_notes`.

        Returns 404 when the note does not exist or the requester cannot read it.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: id
          in: path
          required: true
          description: The note ID (GUID), from `list_notes` or `get_shared_notes`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Note details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDto"
        "404":
          description: No such note, or the requester cannot read it

  /api/v1/note-categories:
    get:
      tags: [Notes]
      operationId: list_note_categories
      summary: List all note categories
      description: |
        Returns the platform's note categories, including each category's ID and exact
        name.

        Use when you need the valid category IDs or exact category names for filtering
        notes.

        This catalog is not patient-specific.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      responses:
        "200":
          description: List of note categories

  # ===================
  # OBSERVATION ENDPOINTS
  # ===================
  /api/v2/Observation:
    get:
      tags: [Observations]
      operationId: list_observations
      summary: List observations with filters and pagination
      description: |
        Returns events in a user's record over a date range, such as lab panels, scans,
        workouts, and self-reports. Includes event type, date, and source.

        Use to find or identify observations. Use marker tools for the measurements
        inside an observation.

        Use `RecordStartDate` and/or `RecordEndDate` as `yyyy-MM-dd`. Either date can be
        used alone.

        Do not omit the date range to work around an error. Without a range, the tool
        returns the most recent rows, which may answer a different question.

        `PageNumber` is 0-based and `PageSize` is 1-100, default 10.

        **Never set `IncludeHealthKitSamples=true`.** It returns every measurement inside
        every matching event. One lab panel came back at 288,000 characters; a ten-panel
        request was rejected outright for exceeding the context window. For underlying
        samples use `get_observation_samples`.

        `MarkerTypeIds` narrows the result to the observations that carry those marker
        types, which is the cheap way to find the panel a named marker came from. Pass
        `markerTypeId` values, and leave `IncludeHealthKitSamples` false — this scopes which
        observations come back, not how much each one carries.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: UserId
          in: query
          description: |
            Filter by Arii user ID. Do not pass an Airia profile ID.
          schema:
            type: string
            format: uuid
        - name: Type
          in: query
          description: "Filter by observation type: Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery."
          schema:
            type: string
            enum: [Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery]
        - name: MarkerTypeIds
          in: query
          description: |
            Restrict to observations carrying these marker types. Marker type IDs (GUIDs)
            from `get_user_marker_types_with_data` or `bulk_search_marker_types` — the same
            ids `specificMarkers` takes on the marker tools.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: SubType
          in: query
          description: Filter by observation sub-type.
          schema:
            type: string
        - name: Source
          in: query
          description: Filter by data source (exact match, e.g., "Oura", "Fitbit", "Garmin").
          schema:
            type: string
        - name: RecordStartDate
          in: query
          description: Patient local calendar start day (YYYY-MM-DD). Can be used alone.
          schema:
            type: string
            format: date
        - name: RecordEndDate
          in: query
          description: Patient local calendar end day (YYYY-MM-DD). Can be used alone.
          schema:
            type: string
            format: date
        - name: StartDate
          in: query
          description: |
            Instant range start. UTC RFC3339 **with `Z` only**, e.g. `2026-08-01T00:00:00Z`.
            A bare `2026-08-01` returns 400. Prefer the record-date pair.
          schema:
            type: string
            format: date-time
        - name: EndDate
          in: query
          description: |
            Instant range end. UTC RFC3339 **with `Z` only**. A bare date returns 400.
            Prefer the record-date pair.
          schema:
            type: string
            format: date-time
        - name: PageNumber
          in: query
          description: Page number (0-based).
          schema:
            type: integer
            default: 0
        - name: PageSize
          in: query
          description: Page size (1-100, default 10). Rejected outside that range.
          schema:
            type: integer
            default: 10
        - name: IncludeHealthKitSamples
          in: query
          description: |
            **Leave false.** True repeats every nested sample payload per row and blows
            the model context. Use `get_observation_samples` for values.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedObservations"

  /api/v2/Observation/{id}:
    get:
      tags: [Observations]
      operationId: get_observation
      summary: Get an observation by ID
      description: |
        Returns one observation in full by ID, including type, dates, source, metadata,
        and tags.

        Use only with an observation ID returned by `list_observations`.

        `sampleCount` reads 0 unless the samples themselves were fetched, so it cannot be
        used to decide whether a panel has results (AIP-247).

        **Never set `includeHealthKitSamples=true`** — the two observation tools spell the
        flag differently and the ban covers both. A single observation can contain an
        unbounded number of measurements. Use `get_observation_samples` when the
        underlying samples are needed.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: id
          in: path
          required: true
          description: The observation ID (GUID), from `list_observations`.
          schema:
            type: string
            format: uuid
        - name: includeHealthKitSamples
          in: query
          description: "**Leave false.** Payloads are unbounded. Use `get_observation_samples` instead."
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Observation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationDto"

  /api/v3/Observation/healthkit/all-samples:
    get:
      tags: [Observations]
      operationId: get_observation_samples
      summary: Get raw measurement samples with the patient's own reference range
      description: |
        Returns raw measurement samples over a date range, including the observation they
        came from and the reference range applicable to the patient.

        Use when you need a patient-specific reference range for a named marker — the
        question "is this result normal for this person?". That is what this tool is for.

        It is not the general history path. There is no marker filter, so a broad call
        returns every sample of every marker in the window. Keep the date range tight,
        and always set `maxSamplesPerMarker` — for a "is this normal" question, 1 is
        usually right. For a trend over time use `get_marker_averages_compact`, and for a
        marker's individual readings use `get_marker_samples_compact`.

        Both `recordStartDate` and `recordEndDate` are required as `yyyy-MM-dd`.

        `observationTypes` uses exact matching against the observation type name. The
        full set is `Lab`, `DeviceTracking`, `SelfReported`, `Scan`, `Exam`, `Activity`,
        `DailySummary`, `SleepSummary`, `HrvSummary`, `Other`, `LifestyleHabit`,
        `Procedure`, `Condition`, `BodyCompositionSummary`, `Assessment`, `Recovery` and
        `Appointment`. Lab results are `Lab`; a DEXA or InBody report arrives as `Scan`;
        a clinician's own measurement is `Exam`. `Appointment` carries no samples at all, so
        filtering by it here returns nothing by construction.

        `appliedReferenceRange` is the range the practice applies to this patient's result,
        filtered by sex and converted to the sample's unit. It is null when no range applies,
        or when the range could not be put in the sample's unit (always for a text result
        with no unit). Null alone does not mean the marker has no range; check
        `metaData.referenceRange` when present.

        `appliedReferenceRange.source` is a string naming where the range came from:
        `Platform` (the system default), `Org` (the practice's default), `Cohort` (a group
        the patient belongs to, named in `cohortName`) or `Patient` (set for this person
        individually). Say which one applied when you report the range. `cohortId` and
        `cohortName` are set only when `source` is `Cohort`.

        Do not confuse `appliedReferenceRange` with `metaData.referenceRange`, which is the
        range printed on the lab report.

        `maxSamplesPerMarker` limits the number of newest samples returned per marker.

        `pageNumber` is 0-based and `pageSize` is 1-100, default 100. Page with
        `hasNextPage`; `totalCount` and `totalPages` come back on the same response.

        If this read fails, say you could not retrieve the data. A failure is never
        evidence that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: query
          description: |
            Arii user ID whose samples to fetch. This is a query parameter, not a path
            segment. Defaults to the requester when omitted — send it explicitly on any
            patient read. Not an Airia profile ID.
          schema:
            type: string
            format: uuid
        - name: recordStartDate
          in: query
          required: true
          description: Patient local calendar start day (YYYY-MM-DD). Required with recordEndDate.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          required: true
          description: Patient local calendar end day (YYYY-MM-DD). Required with recordStartDate.
          schema:
            type: string
            format: date
        - name: observationTypes
          in: query
          description: |
            Comma-separated exact type names, e.g. `Lab,Scan`. Valid values: Lab,
            DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary,
            HrvSummary, Other, LifestyleHabit, Procedure, Condition, BodyCompositionSummary,
            Assessment, Recovery, Appointment.
          schema:
            type: string
        - name: tags
          in: query
          description: Optional marker-type tag filter.
          schema:
            type: array
            items:
              type: string
        - name: maxSamplesPerMarker
          in: query
          description: |
            Cap on the newest samples returned per marker type (>= 1). **Always set it.**
            For "is this normal", 1 is usually right.
          schema:
            type: integer
        - name: pageNumber
          in: query
          description: Page number (0-based, default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Page size (1-100, default 100). The API accepts up to 1000; agents keep to 100 so one result stays small.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Paginated raw samples with applied reference ranges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedObservationSamples"
        "400":
          description: recordStartDate and recordEndDate are both required
        "403":
          description: Requester is not permitted to read this user's samples

  # ===================
  # DOCUMENT ENDPOINTS
  # ===================
  /api/v2/Documents:
    get:
      tags: [Documents]
      operationId: get_user_documents
      summary: Get documents for a user with extracted features
      description: |
        Returns documents on a user's file, including name, type, tags, and dates.

        Use to find documents associated with a person.

        Each row carries a `downloadUrl`, the extraction status, and counts of extracted
        features by review state — total, approved, pending and rejected. Those counts say
        whether extraction is still under human review.

        Does not return the document's contents, and does not return the extracted values
        themselves — only how many there are. It cannot be used to quote or interpret a
        report. To read a lab's numbers use the marker tools.

        Returns a plain list, not a page.

        The document owner is selected with `selectedUserId`.

        `documentId` is the only filter this read applies. There is no category, type or
        provider filter: everything on the person's file comes back and any narrowing is
        yours to do on the returned rows. Judge a document by its own fields rather than
        assuming the set was filtered.

        Omit `RequestingUserId`. The caller is resolved from the session and any value sent
        here is discarded.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: SelectedUserId
          in: query
          required: true
          description: |
            Arii user ID whose documents to retrieve. Not an Airia profile ID.
          schema:
            type: string
            format: uuid
        - name: RequestingUserId
          in: query
          description: |
            Optional, and best omitted. The caller is resolved from the authenticated
            session and whatever is sent here is discarded, so calling `get_current_user`
            to fill it is a wasted round trip.
          schema:
            type: string
            format: uuid
        - name: documentId
          in: query
          description: Filter to a specific document ID (GUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Documents with extracted features

  # ===================
  # SYMPTOM ENDPOINTS
  # ===================
  /api/v1/symptoms:
    get:
      tags: [Symptoms]
      operationId: list_symptoms
      summary: List all available symptoms
      description: |
        Returns the platform's supported symptom catalog, including each symptom's
        canonical ID and name.

        Use to resolve symptom IDs and canonical names when interpreting the symptoms a
        person has recorded, for example the entries returned by `get_user_symptom_details`.

        This catalog is not patient-specific.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      responses:
        "200":
          description: List of available symptoms

  /api/v1/users/{userId}/symptom-details:
    get:
      tags: [Symptoms]
      operationId: get_user_symptom_details
      summary: Get symptom details for a user
      description: |
        Returns symptoms recorded by a user, including symptom, intensity, start date, and
        end date.

        A missing end date means the symptom is still active.

        Omit `requestingUserId` under Bearer/passthrough: the session identifies the caller
        and any value sent is discarded. On the legacy `X-API-Key` path it is still the
        caller's identity, and omitting it there returns 400 "RequestingUserId parameter is
        required."

        Use `recordStartDate` and `recordEndDate` together as `yyyy-MM-dd`. They are the
        patient's own calendar days, and the end day is covered in full. Sending only one of
        them returns 400. The pair takes priority over `startDate` and `endDate`.

        `startDate` and `endDate` are the older form. A plain calendar day such as
        `2026-08-28` is read as a UTC day, so for a patient outside UTC it can miss or add
        entries near midnight. A UTC instant such as `2026-08-28T00:00:00Z` is used exactly
        as sent.

        If this read fails, say you could not retrieve the data. A failure is never
        evidence that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - name: recordStartDate
          in: query
          description: Patient local calendar start day (YYYY-MM-DD). Send together with recordEndDate.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          description: Patient local calendar end day (YYYY-MM-DD), covered in full. Send together with recordStartDate.
          schema:
            type: string
            format: date
        - name: startDate
          in: query
          description: Older form. Window start, as a UTC day `2026-08-28` or a UTC instant with a trailing `Z`. Prefer the record-date pair.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Older form. Window end, as a UTC day `2026-08-28` — the whole day is covered — or a UTC instant with a trailing `Z`. Prefer the record-date pair.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: User symptom details

  # ===================
  # MARKER ENDPOINTS
  # ===================
  /api/v2/Marker/summary-compact/{userId}:
    get:
      tags: [Markers]
      operationId: get_marker_summary_compact
      summary: Get a person's current marker values from every source
      description: |
        Returns a person's current marker values, one row per marker **and source**, on a
        row trimmed to fourteen fields, together with the category counts for the window.

        **Every source.** The app shows one source per marker. This read returns every
        source that has a value in the window — Apple Health, Oura, Mira, the person's own
        entries — each on its own row, the person's preferred source first. So a marker the
        preferred source has nothing for still comes back, from the source that has it. Cite
        each row by its own `dataSourceName` (AIP-350).

        **This is the default read for an open question about how someone is doing.** For
        goals, use `get_marker_averages_compact`, whose rows carry them.

        Each row has `markerTypeId`, `displayName`, `value`, `unit`, `recordDate`,
        `categoryName`, `dataSourceName`, `isPreferredSource`, `aggregationMethod`, and —
        where a reference range applies — `rangeStatus`, `outOfRange` and `referenceRange`,
        the range the value was judged against, in the row's `unit`. A row that was not
        judged has no `referenceRange`. `secondValue` and `textValue` carry blood-pressure
        style pairs and non-numeric results.

        `value` is the window's value by `aggregationMethod`: with `Average` or `Sum` it is
        the average or total over the whole window, dated by the newest reading behind it.
        Only `Latest` is a single reading. No value is carried forward from before the
        window: for "when was X last measured", use `select=Stale`.

        `rangeStatus` is the side of the normal band the row's value is on: `L` below, `H`
        above, `InRange` inside, null when no range could judge it (null never means normal).
        The range is the lab report's own when the reading carries one, else the range
        resolved for this patient — the same judgement `get_out_of_range_results` makes. For
        the range's source and the draw date, call `get_out_of_range_results`.

        **Not paged.** Every matching row comes back. Scope the call: pass `specificMarkers`
        (up to 100), `categoryId`, or a `select` other than `All`. An unscoped `select=All`
        is refused with 400.

        **Filters, all worked out on the server:**
        - `select=Abnormal` — values outside their own reference range. Each source is
          judged on its own, so an out-of-range Oura value shows even when the preferred
          source's value is in range. Prefer it for "how am I doing": it answers over the
          whole chart in a handful of rows.
        - `select=NotInPreferred` — markers the preferred source has nothing for in the
          window while another source does. The preferred source is always checked, even when
          `dataSources` leaves it out; its rows are not returned then.
        - `select=Stale` with `staleDays=N` — markers whose newest reading, in any source, is
          more than N days before `recordEndDate`. Each row is that source's newest reading,
          dated, with `aggregationMethod` `Latest`. `categoryId` is refused with it, its
          rows carry no `categoryName`, and the response's `categoryFacets` is empty and
          `unclassifiedCount` is 0.
        - `select=SourcesDisagree` — markers where two sources' values from the same day
          differ by more than the marker's own trend threshold. Values from different days are
          a change over time and are not compared. A marker with no trend threshold is never
          flagged.
        - `dataSources` — read only these sources.
        - `categoryId` — one category, taken from `categoryFacets`.

        Rows come back grouped by marker, the most recently recorded marker first, and within
        a marker the preferred source first. `markerCount` is the number of markers; rows
        outnumber it when a marker has more than one source.

        `categoryFacets` counts markers per category across the window, before `categoryId`
        is applied. This is the one place a category filter works on a name you can read.
        `unclassifiedCount` is how many markers no source's value could be judged for — read
        it before treating a short abnormal list as "everything else was checked".

        `recordStartDate` and `recordEndDate` are both required as `yyyy-MM-dd`.

        `requestingUserId` is deprecated and ignored: the caller is always the session's own
        identity. This read is Bearer only; under `X-API-Key` it returns 401.

        `specificMarkers` entries that are unparseable or resolve to no marker type are
        skipped and returned in `unmatchedIds` (AIP-236); the call is rejected only when no
        entry parses at all.

        On a share-based read the start date may be narrowed to the share's own window, so
        the range covered can be shorter than the one you asked for, with nothing on the
        response saying so. Read the returned dates rather than assuming your range held.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: recordStartDate
          in: query
          required: true
          description: Start date as a local calendar date (YYYY-MM-DD). Required with recordEndDate.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          required: true
          description: End date as a local calendar date (YYYY-MM-DD). Required with recordStartDate.
          schema:
            type: string
            format: date
        - name: specificMarkers
          in: query
          description: |
            Up to 100 marker type IDs — the `markerTypeId` field of a row, not its `id`.
            Bound as strings rather than GUIDs on purpose: unparseable or unknown entries are
            skipped and returned in `unmatchedIds` instead of failing the call.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: categoryId
          in: query
          description: |
            Restrict rows to one category, using a `categoryId` taken from `categoryFacets`.
            This is a numeric id, not a category name. Not accepted with `select=Stale`.
          schema:
            type: integer
        - name: select
          in: query
          description: |
            `All` (default), `Abnormal`, `NotInPreferred`, `Stale` (needs `staleDays`) or
            `SourcesDisagree`. See the description for what each keeps.
          schema:
            type: string
            enum: [All, Abnormal, NotInPreferred, Stale, SourcesDisagree]
            default: All
        - name: staleDays
          in: query
          description: With `select=Stale` only, and required there. 1–3650.
          schema:
            type: integer
            minimum: 1
            maximum: 3650
        - name: dataSources
          in: query
          description: |
            Read only these sources, e.g. `Oura`. Omitted reads every source. The names match
            `dataSourceName` on a row exactly — `AppleHealth`, not "Apple Health". An unknown
            name is a 400.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/HealthDataSourceName"
      responses:
        "200":
          description: Every matching row, with the category facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkerSummaryCompactResult"
        "400":
          description: Dates missing, the call unscoped, specificMarkers empty, over 100 or with no valid id, staleDays missing or misplaced, categoryId with select=Stale, or dataSources empty or naming an unknown source
        "401":
          description: "No user identity: this read is Bearer only, so an X-API-Key call is refused"
        "403":
          description: Requester is not permitted to read this user's markers

  /api/v2/Marker/out-of-range/{userId}:
    get:
      tags: [Markers]
      operationId: get_out_of_range_results
      summary: List a patient's lab results that are out of range, flagged L or H by the server
      description: |
        Returns the person's lab results that sit outside their normal band. Each one has a
        server-computed `flag`: `L` means below the normal band and `H` means above it. It also
        has a `severity` (`Borderline` or `OutOfRange`), the normal band's bounds
        (`normalRange.min` / `normalRange.max`, where null means open on that side), the
        range's source, and the draw date.

        **Use this whenever you are asked to flag, list or summarise out-of-range lab
        results.** It is the one read that gives, for each result, the side it is off, the
        range it was judged against, where that range came from and the draw date. Band
        labels on `get_observation_samples` (`segments[].label`) are alert levels, not
        directions: in most ranges "Low" is the in-range green band and "High" is a red band
        on either side. Never turn a band label into "low" or "high". Take the direction from
        `flag` only.

        `rangeSource` says whose range decided the flag. `LabReport` is the range printed on
        the lab report. `Patient`, `Cohort`, `Org` (the practice) and `Platform` (the
        default) are the resolved tiers; `cohortName` is set for `Cohort`. When the lab report
        decided the flag and a practice or platform range also applies, that range is in
        `alternateRange` with its own `flag`. Say which source you used, and give the draw
        date (`drawDate`) for every flag.

        `sexSpecific` is `Male` or `Female` when the band used was sex-specific. Say so.

        `noRange` lists the results no range could judge, each with a `reason`:
        `NoRangeDefined`, `SexUnknown` (only sex-specific bands exist and the person has no
        Male/Female sex on record), `UnitMismatch`, `TextResult` or
        `UnrecognizedRangeLabels`. For these, say there is no reference range to judge
        against and give no flag. Never supply a range from general knowledge. A result
        missing from `results` is only in range if it was counted in `inRangeCount`.

        `latestOnly` (default `true`) judges only each marker's most recent draw in the
        window. Pass `false` to judge every draw, for "has this been high before". Both
        dates are optional. Omit them to judge every result on file; `recordEndDate` before
        `recordStartDate` returns 400. When `truncated` is true the read stopped at its
        sample cap. Narrow the window, and say the list may be incomplete.

        `documentId` is the uploaded lab report the result was extracted from (null for
        results from a connector). `observationId` is the lab panel and `sampleId` the result.

        Omit `requestingUserId` under Bearer/passthrough: the session identifies the caller
        and any value sent is discarded. On the legacy `X-API-Key` path it is still the
        caller's identity.

        On a share-based read the start date may be narrowed to the share's own window.

        If this read fails, say you could not check the results against their ranges and
        flag nothing. A failure is never evidence that the results are normal.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - name: recordStartDate
          in: query
          description: Optional first draw date as a local calendar date (YYYY-MM-DD), inclusive.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          description: Optional last draw date as a local calendar date (YYYY-MM-DD), inclusive.
          schema:
            type: string
            format: date
        - name: latestOnly
          in: query
          description: |
            `true` (default) judges only each marker's most recent draw in the window.
            `false` judges every draw.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: The out-of-range results, the in-range count, and the results no range could judge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfRangeLabResults"
        "400":
          description: recordEndDate is before recordStartDate
        "403":
          description: Requester is not permitted to read this user's markers

  /api/v2/Marker/averages-compact/{userId}:
    get:
      tags: [Markers]
      operationId: get_marker_averages_compact
      summary: Get marker trends from every source, with the trend worked out
      description: |
        Returns a trend for each named marker, one row per marker **and source**, the
        person's preferred source first (AIP-350).

        **Use this for any trend or "compared to usual" question.** It returns the averages
        with the arithmetic already done: `direction` (`Up`, `Down` or `Flat`, from a
        straight-line fit over every daily value, `Flat` when the change is smaller than the
        marker's own trend threshold) and `change` (in the marker's unit). Report those; do
        not work the trend out yourself.

        Each row has `markerTypeId`, `displayName`, `unit`, `dataSourceName`,
        `isPreferredSource`, `dailyAverage`, `weekdayAverage`, `weekendAverage`,
        `highestSingleDay`, `lowestRange`, `highestRange`, `readingDays` (days with a value),
        `firstRecordDate`, `lastRecordDate`, `direction`, `change`, `goal`, `goalGap`,
        `daysMeetingGoal`, `daysMissingGoal`, `baselineAverage`, `displayPrecision` and
        `referenceRange` — the range on that source's newest reading in the window that
        carries one, absent when none does. Every number is already rounded to
        `displayPrecision`.

        `lastRecordDate` earlier than the window's end means that source stopped sending:
        say so. A source with no value in the window has no row.

        **Options:**
        - `groupBy=Week` or `groupBy=Month` — adds `periods`, one average per calendar week
          (Monday to Sunday) or month, each with its `readingDays`. A period's `periodStart`
          and `periodEnd` are its first and last days with a value, not the week's or month's
          bounds. Use it for "month by month" and for any window longer than a few weeks.
        - `baselineDays=N` — adds `baselineAverage` over the N days before
          `recordStartDate`, from the same source. "Compared to usual" in one call: a 30-day
          window with `baselineDays=90` compares the month with the 90 days before it.
        - Goals: `goalGap` is `dailyAverage − goal`. `daysMeetingGoal` and `daysMissingGoal`
          count days, when the goal is a floor, a ceiling or a range. Both are null for a
          single target value, which says nothing about which side is better, and `goal`
          and `goalGap` are null when the goal is in a unit that cannot be converted to
          `unit`.
        - `select=Changing` — only rows whose `direction` is `Up` or `Down`.
        - `includeChart=true` — adds `chartData`, one `{recordDate, value}` per day with a
          value. **Off by default. Turn it on only to draw a chart.**
        - `dataSources` — read only these sources.

        `specificMarkers` is required, 1–20 ids, from `get_user_marker_types_with_data`.
        `recordStartDate` and `recordEndDate` are both required as `yyyy-MM-dd`. No value is
        carried forward from before the window. Not paged.

        On a share-based read the start date may be narrowed to the share's own window, so
        the range covered can be shorter than the one you asked for, with nothing on the
        response saying so. The baseline stops at the share's start too, so `baselineAverage`
        can cover fewer than `baselineDays` days. Read the returned dates rather than assuming
        your range held.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: recordStartDate
          in: query
          required: true
          description: Start date as a local calendar date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          required: true
          description: End date as a local calendar date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: specificMarkers
          in: query
          required: true
          description: |
            1–20 marker type IDs from `get_user_marker_types_with_data`. Unusable entries are
            skipped and returned in `unmatchedIds`.
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
        - name: select
          in: query
          description: "`All` (default) or `Changing`: only rows whose direction is Up or Down."
          schema:
            type: string
            enum: [All, Changing]
            default: All
        - name: groupBy
          in: query
          description: "`None` (default), `Week` or `Month`: adds one average per calendar week or month."
          schema:
            type: string
            enum: [None, Week, Month]
            default: None
        - name: baselineDays
          in: query
          description: Adds `baselineAverage` over this many days before recordStartDate. 1–365.
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - name: includeChart
          in: query
          description: Adds the daily points. Off by default; turn it on only to draw a chart.
          schema:
            type: boolean
            default: false
        - name: dataSources
          in: query
          description: |
            Read only these sources, e.g. `Oura`. Omitted reads every source. The names match
            `dataSourceName` on a row exactly — `AppleHealth`, not "Apple Health". An unknown
            name is a 400.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/HealthDataSourceName"
      responses:
        "200":
          description: One row per marker and source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkerAveragesCompactResult"
        "400":
          description: Dates missing, specificMarkers missing, over 20 or with no valid id, baselineDays out of range, or dataSources empty or naming an unknown source
        "401":
          description: "No user identity: this read is Bearer only, so an X-API-Key call is refused"
        "403":
          description: Requester is not permitted to read this user's markers

  /api/v2/Marker/samples-compact/{userId}:
    get:
      tags: [Markers]
      operationId: get_marker_samples_compact
      summary: Get individual readings from every source
      description: |
        Returns individual readings for the named markers from **every source**, by marker,
        newest first, the preferred source first on the same day (AIP-350).

        **Use this for "latest", "today", "on the 14th" and any individual reading.**
        - `latestPerSource=true` — only the newest reading per marker per source: "what's
          her latest HRV" from every source in one call. No window needed; with a window, it
          is the newest reading inside it.
        - `takePerSource=N` — the newest N per marker per source, 1–100. No window needed;
          with a window, the newest N inside it. With `select`, `valueAbove` or `valueBelow`
          the filter runs first and the newest N matches are kept, which needs a window:
          "her last 5 out-of-range readings this year" is `takePerSource=5&select=OutOfRange`
          with the year's dates.
        - `select=OutOfRange` — only readings outside the reference range they carry.
        - `valueAbove=X` / `valueBelow=X` — "days her blood pressure was over 140", in the
          reading's unit.
        - `dataSources` — read only these sources.

        Each reading has `markerTypeId`, `value`, `secondValue`, `textValue`, `unit`,
        `recordDate`, `startDate`, `dataSourceName`, `originalSource` (the device inside an
        aggregator such as Apple Health), `isPreferredSource`, `referenceRange` (the range
        printed with the reading — a lab report's own range — in the reading's unit, when it
        carries one; quote it as the report's range), `rangeStatus` and `outOfRange`.

        **Capped at 500 readings, not paged,** shared between the markers so a quiet marker
        is not crowded out by a busy one. Each marker is read up to its newest 1,000 readings
        per source in the window, and the filters apply to those. `truncated` is true when
        either limit cut something: the answer may be missing older readings, which were not
        read or not returned. Say so, and narrow the window, the markers or the filters to
        read the rest.

        `specificMarkers` is required, 1–20 ids. `recordStartDate` and `recordEndDate` are
        required together as `yyyy-MM-dd`, unless `latestPerSource` or `takePerSource` is
        set without `select`, `valueAbove` or `valueBelow`.

        On a share-based read the start date may be narrowed to the share's own window.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: recordStartDate
          in: query
          description: Start date (YYYY-MM-DD). Required with recordEndDate, unless latestPerSource or takePerSource is set without select, valueAbove or valueBelow.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          description: End date (YYYY-MM-DD). Passed together with recordStartDate.
          schema:
            type: string
            format: date
        - name: specificMarkers
          in: query
          required: true
          description: 1–20 marker type IDs from `get_user_marker_types_with_data`.
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
        - name: latestPerSource
          in: query
          description: Only the newest reading per marker per source, inside the window when one is given. Not with takePerSource.
          schema:
            type: boolean
            default: false
        - name: takePerSource
          in: query
          description: Only the newest N readings per marker per source, 1–100, inside the window when one is given. With a filter, the newest N matches. Not with latestPerSource.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: select
          in: query
          description: "`All` (default) or `OutOfRange`: only readings outside their reference range."
          schema:
            type: string
            enum: [All, OutOfRange]
            default: All
        - name: valueAbove
          in: query
          description: Only readings above this value, in the reading's unit.
          schema:
            type: number
        - name: valueBelow
          in: query
          description: Only readings below this value, in the reading's unit.
          schema:
            type: number
        - name: dataSources
          in: query
          description: |
            Read only these sources, e.g. `Oura`. Omitted reads every source. The names match
            `dataSourceName` on a row exactly — `AppleHealth`, not "Apple Health". An unknown
            name is a 400.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/HealthDataSourceName"
      responses:
        "200":
          description: Readings from every source, capped at 500
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkerSamplesCompactResult"
        "400":
          description: specificMarkers missing, over 20 or with no valid id; only one of the two dates; the window missing without latestPerSource/takePerSource, or missing when either is combined with select, valueAbove or valueBelow; both latestPerSource and takePerSource set; takePerSource outside 1–100; or dataSources empty or naming an unknown source
        "401":
          description: "No user identity: this read is Bearer only, so an X-API-Key call is refused"
        "403":
          description: Requester is not permitted to read this user's markers

  # ===================
  # MARKER TYPE ENDPOINTS
  # ===================
  /api/v2/MarkerType/lookup:
    post:
      tags: [MarkerTypes]
      operationId: bulk_search_marker_types
      summary: Resolve marker names to marker type IDs
      description: |
        Resolves marker names to marker type IDs.

        Use when you have a marker name and need its ID before calling another marker tool.

        Supports up to 200 keywords. Matching is case-insensitive substring matching against
        names, aliases, and lab component names. It is not fuzzy matching and does not apply
        synonyms.

        Use the clinical marker name rather than the user's wording when possible: `my sugar`
        matches nothing where `glucose` and `hba1c` do; `bp` returns IGFBP-3, so send
        `blood pressure`. A device is not a marker — "my rings" is an Oura ring, whose
        markers are Readiness Score and Sleep Score. Send every candidate form in the one
        call; keywords cost nothing and a marker you fail to find costs the answer.

        If the same marker name exists for different specimens, the results distinguish them
        by type — `Ferritin` is both Serum and Blood, `Glucose` both Blood and Urine. Pick
        the specimen the question implies.

        Results are keyed by the keyword you sent. An empty array for a keyword means the
        catalog has no such marker — it does not mean the patient has no data for it. Do not
        report absence from this tool.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                  description: Search keywords (up to 200). Send every form the question needs in one call.
                tenantId:
                  type: string
                  format: uuid
                  description: Optional tenant/group ID (GUID) to filter by.
                includeDefault:
                  type: boolean
                  description: Whether to include default (null tenant) marker types.
      responses:
        "200":
          description: Marker types grouped by keyword

  /api/v2/MarkerType:
    get:
      tags: [MarkerTypes]
      operationId: list_marker_types
      summary: List marker types with filtering and pagination
      description: |
        Returns the platform marker catalog with search and paging, including marker name,
        aliases, unit, display precision, category, and system reference ranges.

        Use when you need to search or inspect marker definitions, including the question
        "what is the normal range for this marker?".

        Filter with `search`, `name`, `tags` or `labProvider` rather than paging through
        the catalog.

        `category` here is the same numeric category id that `get_user_marker_types_with_data`
        returns, stored as text — not a display name. Sending "Lipids & Cardiovascular Risk"
        matches nothing and returns an empty page, which is not the same as the catalog
        having no such markers. Filter by `name`, `search` or `tags` instead.

        The `systemReferenceRanges` are platform-level ranges, not patient-specific ranges.
        Do not use them to determine whether a patient's result is normal, and when nothing
        comes back say the range is not on record rather than supplying one from general
        knowledge.

        `pageNumber` is 0-based and `pageSize` is 1-100, default 10.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: search
          in: query
          description: Filter by name containing this string.
          schema:
            type: string
        - name: name
          in: query
          description: Exact name filter.
          schema:
            type: string
        - name: category
          in: query
          description: |
            Exact match on the marker type's category **id stored as text** (e.g. "7"), not
            a display name. Prefer `name`, `search` or `tags` unless you already hold a
            numeric category id.
          schema:
            type: string
        - name: tenantId
          in: query
          description: Fetch marker types for a specific tenant/group (GUID).
          schema:
            type: string
            format: uuid
        - name: includeDefault
          in: query
          description: If true, include marker types with no tenantId (system defaults). Default true.
          schema:
            type: boolean
            default: true
        - name: withQuantityType
          in: query
          description: |
            Filter on whether QuantityType is set. true = only non-null; false = only null;
            omit to return both.
          schema:
            type: boolean
        - name: tags
          in: query
          description: Filter by tags.
          schema:
            type: array
            items:
              type: string
        - name: labProvider
          in: query
          description: Filter by lab provider.
          schema:
            type: string
        - name: includeAllTags
          in: query
          description: If true, include all tags in the response.
          schema:
            type: boolean
        - name: excludeCategories
          in: query
          description: Category IDs to exclude from results.
          schema:
            type: array
            items:
              type: string
        - name: pageNumber
          in: query
          description: Page number (0-based, default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Page size (1-100, default 10).
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated marker types

  /api/v2/MarkerType/{id}:
    get:
      tags: [MarkerTypes]
      operationId: get_marker_type
      summary: Get a marker type by ID
      description: |
        Returns one marker definition by ID, including name, aliases, SI and conventional
        units, the conversion factor between them, LOINC and SNOMED codes, display
        precision, category, and system reference ranges.

        Use when you already have a marker type ID and need its definition, unit, or display
        precision.

        Does not return patient values.

        For searching by name, use `list_marker_types` or `bulk_search_marker_types`.

        `systemReferenceRanges` are platform-level ranges, not patient-specific ranges.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: id
          in: path
          required: true
          description: The marker type ID (GUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Marker type details

  # ===================
  # DATA DICTIONARY ENDPOINTS
  # ===================
  /api/v2/Users/{userId}/DataDictionary/MarkerTypes:
    get:
      tags: [DataDictionary]
      operationId: get_user_marker_types_with_data
      summary: List marker types a user has data for
      description: |
        Returns the marker types that have at least one sample in the user's complete
        history.

        **Call this first, before any other marker read, for the patient the question is
        about.** It is the only tool that says which markers this person actually has, so it
        is what turns a name in a question into an id you can safely ask for. It applies to a
        patient you are reading as a clinician exactly as it does to yourself: access is
        resolved from who is asking, and no header is involved.

        Marker types only — no values, no dates, no ranges — and it covers the person's whole
        history, so a marker here may still have no reading in the window you go on to ask
        about. Its `category` is a numeric id rather than a name; match on `name` and
        `aliases`.

        A marker absent from this list is not recorded for this patient, and saying so needs
        no further call. A 403 is an access problem and never an absence.

        It does not say which sources a marker came from. The compact marker reads do: every
        row names its own source in `dataSourceName`. Call `get_marker_data_sources` with the
        ids you matched here only when the question is about the sources themselves, such as
        "which devices track my sleep?".

        Then read what the question calls for, scoped to these ids with `specificMarkers`:
        `get_marker_summary_compact` for current values, `get_marker_averages_compact` for a
        trend or a goal, `get_marker_samples_compact` for individual readings,
        `get_observation_samples` for whether a result is normal for this person.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: excludeSkipDailyAggregations
          in: query
          description: |
            When true, drop marker types whose only samples carry the
            `skip-daily-aggregations` tag — activity-derived device samples not meant for
            daily display. Default false, which returns everything the person has.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Marker types the user has data for
        "403":
          description: Requester is not permitted to read this user's data dictionary

  /api/v2/Users/{userId}/DataDictionary/MarkerTypes/DataSources:
    get:
      tags: [DataDictionary]
      operationId: get_marker_data_sources
      summary: List the sources each marker has readings from
      description: |
        Returns, for each marker type you ask about, the sources this person has readings
        from — a device such as `"Oura"` or `"AppleHealth"`, a lab, a manual entry — as names,
        sorted. It covers the person's whole history, not a window: a source listed here has
        readings for the marker at some time, not necessarily in the period asked about.

        **When to call it.** Rarely. The compact marker reads return every source's values,
        so they already say which sources a marker has in the window. Call this when the
        question is about the sources themselves — "which devices track my sleep?" — or to
        know which sources hold a marker at any time, not only in the window you read.

        **Always pass `scope=ExistingData`.** It lists the sources that hold readings. Without
        it the default also lists connected devices that could supply a marker but have sent
        nothing, which would send the person looking for data that does not exist.

        An empty list means no readings from any source.

        Pass each id as its own `markerTypeIds` entry, copied from
        `get_user_marker_types_with_data`. Every id you send comes back, with an empty list
        when no source applies. An empty `markerTypeIds` returns 400; omitting it returns
        every marker the person has, which is rarely what the question needs.

        Access is resolved from who is asking, exactly as for
        `get_user_marker_types_with_data`; no header is involved. A 403 is an access problem
        and never an absence.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: markerTypeIds
          in: query
          description: |
            Marker type IDs to report on — the `id` of a `get_user_marker_types_with_data`
            row. Repeat the parameter for each one.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: scope
          in: query
          description: |
            Which sources to list. Always send `ExistingData`: sources the person has
            readings from. `ConnectedIntegrations` is connected devices whether or not they
            sent anything, and `All` (the default) is both.
          schema:
            type: string
            enum: [ExistingData, ConnectedIntegrations, All]
            default: All
      responses:
        "200":
          description: |
            One entry per marker type, `{ markerTypeId, dataSources }`, where `dataSources`
            is a sorted list of source names.
        "400":
          description: "`markerTypeIds` was given but empty"
        "403":
          description: Requester is not permitted to read this user's data dictionary

components:
  parameters:
    # Canonical Arii user-ID parameters. Kept here so the ID-kind guidance has a
    # single source of truth instead of drifting across inline copies.
    AriiUserIdPath:
      name: userId
      in: path
      required: true
      description: |
        Arii user ID (`UserDto.id` GUID) this operation applies to — the subject of the
        read, from execution context. Never the requester's own id on a clinician turn,
        and never an Airia profile ID, Keycloak `sub`, or group ID: those return 404
        "No user found" under Bearer auth.
      schema:
        type: string
        format: uuid
    AriiRequestingUserIdQuery:
      name: requestingUserId
      in: query
      description: |
        Optional, and best omitted. The API resolves the requester from the authenticated
        session and discards whatever is sent here, so calling `get_current_user` just to
        fill it is a wasted round trip and a chance to send the wrong id (AIP-245). It is
        honoured only on the legacy `X-API-Key` path. If you do send it, it is the caller's
        own Arii user ID — never the patient's, an Airia profile ID, or a Keycloak `sub`.
      schema:
        type: string
        format: uuid

  schemas:
    CurrentUserIdentityDto:
      type: object
      description: |
        Safe identity fields from `get_current_user` (`GET /api/v1/Users/me`).
        Narrower than UserDto — no image, anchors, or sync timestamps.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Arii user ID of the authenticated caller — never the `userId` of a patient data
            read. Reads resolve the caller from the session, so this does not need to be
            passed on to them.
        airiaProfileId:
          type: string
          format: uuid
          description: |
            Airia Platform profile ID for correlation only — not valid as Bearer path
            `userId` (profile to Arii translation is API Key only).
        email:
          type: string
          description: Caller's email address
        firstName:
          type: string
          description: Caller's first name
        lastName:
          type: string
          description: Caller's last name
        isVerified:
          type: boolean
          description: Whether the caller's email is verified
        activeGroupId:
          type: string
          format: uuid
          description: Caller's active Arii group/organization ID (not a user ID)

    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: |
            Arii user ID — the only GUID valid for path/query `userId`,
            `requestingUserId`, `SelectedUserId`, and `RequestingUserId` under
            Bearer/passthrough auth.
        airiaProfileId:
          type: string
          format: uuid
          description: |
            Linked Airia Platform profile ID. Correlation only — never substitute this
            value for Arii `userId` parameters under Bearer/passthrough.
        firstName:
          type: string
          description: First name
        middleName:
          type: string
          description: Middle name
        lastName:
          type: string
          description: Last name
        email:
          type: string
          description: Email address
        isVerified:
          type: boolean
          description: Whether the user's email is verified
        activeGroupId:
          type: string
          format: uuid
          description: Active group/organization ID (not a user ID)
        imageBase64:
          type: string
          description: Profile image. Despite the name, this holds a URL.
        lastAppleHealthSyncTimestamp:
          type: string
          format: date-time
          description: |
            Last Apple Health sync. The only connector sync time that is ever populated —
            a stale value explains missing recent readings.
        lastGarminSyncTimestamp:
          type: string
          format: date-time
          description: Always null. No code path writes it. Do not report it.
        lastHealthConnectSyncTimestamp:
          type: string
          format: date-time
          description: Always null. No code path writes it. Do not report it.

    JournalDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Journal entry ID
        userId:
          type: string
          format: uuid
          description: Arii user ID this entry belongs to.
        title:
          type: string
          description: Journal title
        content:
          type: string
          description: Journal content
        journalDate:
          type: string
          format: date-time
          description: Date of the journal event
        imageUrls:
          type: array
          items:
            type: string
          description: URLs of attached images
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MealNutritionSample:
      type: object
      description: |
        One nutrient recorded against a meal. Read `quantityTypeName` — it names the nutrient
        directly. `quantityType` is the same value as an integer, kept for clients that already
        read it; use it only when the name is absent, via this mapping:

        | quantityType | Nutrient            | Usual unit |
        |---|---|---|
        | 1  | Carbohydrates       | g    |
        | 3  | Energy (calories)   | kcal |
        | 4  | Fibre               | g    |
        | 5  | Protein             | g    |
        | 6  | Sodium              | mg   |
        | 7  | Total fat           | g    |
        | 13 | Sugar               | g    |

        Codes 4 and 7 (fibre and total fat), and 1 and 5 (carbohydrates and protein), are the
        pairs most often reported the wrong way round. Check the code, not the magnitude.
      properties:
        quantityTypeName:
          type: string
          description: >-
            The nutrient's name, e.g. `TotalFats`, `DietaryFiber`, `DietaryProtein`,
            `DietaryCarbohydrates`, `DietaryEnergy`, `DietarySodium`, `DietarySugar`.
            Prefer this over `quantityType`; they always agree.
        quantityType:
          type: integer
          description: >-
            Nutrient code: 1 carbohydrates, 3 energy (kcal), 4 fibre, 5 protein, 6 sodium,
            7 total fat, 13 sugar. Any other value is a nutrient this table does not cover —
            report it by code rather than guessing a name.
          enum: [1, 3, 4, 5, 6, 7, 13]
        value:
          type: number
          description: The recorded amount, in `unit`.
        unit:
          type: string
          description: Unit as recorded — g for macros, mg for sodium, kcal for energy.

    MealDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Meal ID
        name:
          type: string
          description: Meal name
        description:
          type: string
          description: Meal description
        date:
          type: string
          format: date-time
          description: Meal date
        portionSize:
          type: integer
          description: Number of servings
        servingSizeImperial:
          type: number
          description: Imperial serving size
        servingUnitImperial:
          type: string
          description: Imperial serving unit
        servingSizeMetric:
          type: number
          description: Metric serving size
        servingUnitMetric:
          type: string
          description: Metric serving unit
        healthKitSamples:
          type: array
          description: |
            The meal's nutrition, one entry per nutrient. `quantityType` is a numeric code,
            not a name — read it from the enum on the item schema and never infer a nutrient
            from the order entries arrive in.
          items:
            $ref: "#/components/schemas/MealNutritionSample"


    NoteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Note ID
        title:
          type: string
          description: Note title
        date:
          type: string
          format: date-time
          description: Note date
        content:
          type: string
          description: Note content (may be HTML or plain text)
        private:
          type: boolean
          description: Whether the note is private
        archived:
          type: boolean
          description: Whether the note is archived
        isDraft:
          type: boolean
          description: Whether this is a draft
        createdBy:
          type: string
          format: uuid
          description: Creator user ID
        tenantId:
          type: string
          format: uuid
          description: Tenant/organization ID
        patientIds:
          type: array
          items:
            type: string
            format: uuid
          description: Associated patient IDs
        categories:
          type: array
          items:
            type: string
          description: Category names
        sharedBy:
          type: string
          format: uuid
          description: Who shared the note (on `get_shared_notes` results).
        sharedAt:
          type: string
          format: date-time
          description: When the note was shared (on `get_shared_notes` results).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagedNotes:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteDto"
        totalCount:
          type: integer
          description: Total items across all pages
        pageNumber:
          type: integer
          description: Current page (0-based)
        pageSize:
          type: integer
          description: Items per page
        totalPages:
          type: integer
        hasNextPage:
          type: boolean

    ObservationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Observation ID
        type:
          type: string
          description: "Observation type: Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery"
        subType:
          type: string
          description: Observation sub-type
        date:
          type: string
          format: date-time
          description: |
            Observation date. List order is undocumented — sort by this field descending
            to find the newest panel, and always report it with values.
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        source:
          type: string
          description: Data source
        annotations:
          type: string
          description: Additional annotations
        userId:
          type: string
          format: uuid
          description: Arii user ID this observation belongs to.
        tenantId:
          type: string
          format: uuid
          description: Tenant ID
        metadata:
          type: object
          description: Arbitrary metadata key-value pairs
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization
        sampleCount:
          type: integer
          description: |
            Reads 0 unless samples were fetched, so it cannot say whether a panel has
            results (AIP-247).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HealthDataSourceName:
      type: string
      description: |
        A source's name, exactly as `dataSourceName` spells it on a compact marker row.
        Matches the API's `HealthDataSource` enum; a name outside this list is a 400.
      enum:
        - Arii
        - Fitbit
        - Oura
        - Withings
        - AppleHealth
        - Garmin
        - Whoop
        - BioStrap
        - Strava
        - HealthConnect
        - Elation
        - FreeStyleLibre
        - Cronometer
        - Mira
        - Dexcom
        - Polar
        - Omron
        - HeartMath
        - InBody
        - Cerbo
        - AdvancedMd
        - OneUpHealth
        - JunctionLabReport
        - Kardia
        - Peloton
        - Healthie
        - Athena
        - HeadsUpV1
        - HumanApi
        - Ultrahuman
        - SamsungHealth
        - Viome
        - Zwift
        - Beurer

    MarkerCategoryFacet:
      type: object
      description: One category's marker-type count across the whole requested window.
      properties:
        categoryId:
          type: integer
          nullable: true
          description: Category id to pass back as `categoryId`. Null when the category could not be resolved.
        categoryName:
          type: string
          nullable: true
          description: Resolved display name, e.g. "Lipids & Cardiovascular Risk".
        markerCount:
          type: integer
          description: Marker types in this category within the window, counted before any `categoryId` filter.

    MarkerSummaryCompact:
      type: object
      description: One marker's value in the window from one source, trimmed for agent reads.
      properties:
        markerTypeId:
          type: string
          format: uuid
          nullable: true
          description: The marker type. This is what `specificMarkers` takes on every marker tool.
        displayName:
          type: string
        value:
          type: number
        secondValue:
          type: number
          nullable: true
          description: Second component of a paired reading, such as diastolic blood pressure.
        textValue:
          type: string
          nullable: true
          description: Set when the result is not numeric.
        unit:
          type: string
        aggregationMethod:
          type: string
          nullable: true
          description: How the value was derived over the window, e.g. latest, sum or average.
        recordDate:
          type: string
          format: date
          description: The day the value was recorded. Read it before calling a value current.
        categoryName:
          type: string
          nullable: true
          description: Resolved category display name, not the numeric id.
        dataSourceName:
          type: string
          nullable: true
          description: The source this row's value came from. A marker has one row per source.
        isPreferredSource:
          type: boolean
          description: True on the person's preferred source's row.
        referenceRange:
          allOf:
            - $ref: "#/components/schemas/PrintedReferenceRange"
          description: >-
            The range `rangeStatus` was judged against, in `unit`. Absent when the value was
            not judged. Quote it as the report's range.
        rangeStatus:
          type: string
          nullable: true
          enum: [L, H, InRange]
          description: L below the normal band, H above it, InRange inside it. Null when no range could judge the value — never read null as normal.
        outOfRange:
          type: boolean
          description: True when the value is outside its normal band, borderline or further.

    MarkerSummaryCompactResult:
      type: object
      description: Every matching compact row, one per marker and source. Not paged.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarkerSummaryCompact"
        markerCount:
          type: integer
          description: Distinct markers in `items`. Rows outnumber it when a marker has more than one source.
        categoryFacets:
          type: array
          description: Marker count per category for the whole window, ordered by count descending. Empty with `select=Stale`.
          items:
            $ref: "#/components/schemas/MarkerCategoryFacet"
        unclassifiedCount:
          type: integer
          description: |
            Markers in the window no source's value could be judged against a reference range,
            counted before any selection. With `select=Abnormal` read it before treating a
            short out-of-range list as "everything else was checked and fine". 0 with
            `select=Stale`.
        unmatchedIds:
          type: array
          nullable: true
          description: |
            Entries of `specificMarkers` that were unparseable or resolved to no marker
            type. A short result with entries here means the ids were wrong, not that the
            person has no data.
          items:
            type: string

    LabNormalRange:
      type: object
      description: A normal band. A null bound means the band is open on that side.
      properties:
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true

    AlternateLabRange:
      type: object
      description: The practice or platform range that also applies to a result judged by its lab report's range.
      properties:
        rangeSource:
          type: string
          enum: [LabReport, Patient, Cohort, Org, Platform]
        cohortName:
          type: string
          nullable: true
        normalRange:
          $ref: "#/components/schemas/LabNormalRange"
        flag:
          type: string
          nullable: true
          enum: [L, H]
          description: The result against this range. Null when it is inside it.

    OutOfRangeLabResult:
      type: object
      description: One lab result outside its normal band.
      properties:
        markerTypeId:
          type: string
          format: uuid
        markerName:
          type: string
        value:
          type: number
        unit:
          type: string
          nullable: true
          description: The result's unit. `normalRange` is in the same unit.
        flag:
          type: string
          enum: [L, H]
          description: L is below the normal band, H is above it. Computed from the bounds, never from a band label.
        severity:
          type: string
          enum: [Borderline, OutOfRange]
        normalRange:
          $ref: "#/components/schemas/LabNormalRange"
        rangeSource:
          type: string
          enum: [LabReport, Patient, Cohort, Org, Platform]
        cohortName:
          type: string
          nullable: true
        sexSpecific:
          type: string
          nullable: true
          enum: [Male, Female]
        alternateRange:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AlternateLabRange"
        drawDate:
          type: string
          format: date
          description: The day the sample was taken.
        sampleId:
          type: string
          format: uuid
        observationId:
          type: string
          format: uuid
          nullable: true
        documentId:
          type: string
          format: uuid
          nullable: true
          description: The uploaded lab report the result was extracted from, or null.
        observationSource:
          type: string
          nullable: true
          description: How the result reached the chart, e.g. DocumentExtraction.

    UnjudgedLabResult:
      type: object
      description: A lab result no range could judge.
      properties:
        markerTypeId:
          type: string
          format: uuid
        markerName:
          type: string
        value:
          type: number
          nullable: true
        textValue:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        drawDate:
          type: string
          format: date
        reason:
          type: string
          enum: [NoRangeDefined, SexUnknown, UnitMismatch, TextResult, UnrecognizedRangeLabels]

    OutOfRangeLabResults:
      type: object
      properties:
        recordStartDate:
          type: string
          format: date
          nullable: true
        recordEndDate:
          type: string
          format: date
          nullable: true
        latestOnly:
          type: boolean
        evaluatedCount:
          type: integer
          description: Results looked at, judged or not.
        inRangeCount:
          type: integer
          description: Judged results inside their normal band.
        truncated:
          type: boolean
          description: True when the read stopped at its sample cap; the lists are then partial.
        results:
          type: array
          items:
            $ref: "#/components/schemas/OutOfRangeLabResult"
        noRange:
          type: array
          items:
            $ref: "#/components/schemas/UnjudgedLabResult"

    MarkerAverageCompact:
      type: object
      description: One marker's trend over the window from one source. Every number is rounded to `displayPrecision`.
      properties:
        markerTypeId:
          type: string
          format: uuid
        displayName:
          type: string
        unit:
          type: string
          nullable: true
        dataSourceName:
          type: string
          description: The source these values came from.
        isPreferredSource:
          type: boolean
        dailyAverage:
          type: number
        weekdayAverage:
          type: number
        weekendAverage:
          type: number
        highestSingleDay:
          type: number
        lowestRange:
          type: number
        highestRange:
          type: number
        readingDays:
          type: integer
          description: Days in the window with a value.
        firstRecordDate:
          type: string
          format: date
        lastRecordDate:
          type: string
          format: date
          description: Earlier than the window's end when this source stopped sending.
        direction:
          type: string
          enum: [Flat, Up, Down]
          description: From a straight-line fit over the daily values. Absent with fewer than two days.
        change:
          type: number
          nullable: true
          description: Fitted value on the last day minus the first, in `unit`. Null with fewer than two days.
        goal:
          type: number
          nullable: true
          description: |
            The goal for this marker, in `unit` and rounded like the other numbers: the person's
            own goal, or the platform's default when they set none. A goal set in another unit is
            converted. Null when there is no goal, or no conversion exists for the two units.
        goalGap:
          type: number
          nullable: true
          description: "`dailyAverage` minus `goal`. Null exactly when `goal` is."
        daysMeetingGoal:
          type: integer
          nullable: true
          description: Days with a value that met the goal. Null when `goal` is null, for a single-value goal, which has no better side, and for a range goal missing its minimum or maximum.
        daysMissingGoal:
          type: integer
          nullable: true
          description: Days with a value that missed the goal. Null exactly when `daysMeetingGoal` is.
        baselineAverage:
          type: number
          nullable: true
          description: |
            Average over the `baselineDays` days before the window, from the same source. Null
            when no baseline was asked for, the share leaves no days before the window, or those
            days hold no values.
        displayPrecision:
          type: integer
          nullable: true
        referenceRange:
          allOf:
            - $ref: "#/components/schemas/PrintedReferenceRange"
          description: >-
            The range on the newest reading in the window that carries one, in `unit`. Absent
            when no reading carries one. Quote it as the report's range.
        periods:
          type: array
          description: With `groupBy` only. One entry per week or month with a value.
          items:
            type: object
            properties:
              periodStart:
                type: string
                format: date
                description: The period's first day with a value.
              periodEnd:
                type: string
                format: date
                description: The period's last day with a value.
              average:
                type: number
              readingDays:
                type: integer
        chartData:
          type: array
          description: With `includeChart=true` only.
          items:
            type: object
            properties:
              recordDate:
                type: string
                format: date
              value:
                type: number

    MarkerAveragesCompactResult:
      type: object
      properties:
        items:
          type: array
          description: Grouped by marker, preferred source first within a marker.
          items:
            $ref: "#/components/schemas/MarkerAverageCompact"
        unmatchedIds:
          type: array
          nullable: true
          items:
            type: string

    MarkerSampleCompact:
      type: object
      description: One reading from one source.
      properties:
        markerTypeId:
          type: string
          format: uuid
        value:
          type: number
        secondValue:
          type: number
          nullable: true
        textValue:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        recordDate:
          type: string
          format: date
        startDate:
          type: string
          format: date-time
        dataSourceName:
          type: string
          nullable: true
        originalSource:
          type: string
          nullable: true
          description: The device inside an aggregator such as Apple Health, when the source reports one.
        isPreferredSource:
          type: boolean
        referenceRange:
          allOf:
            - $ref: "#/components/schemas/PrintedReferenceRange"
          description: The range printed with the reading, in its unit. Absent when it carries none.
        rangeStatus:
          type: string
          nullable: true
          description: Band from the range the reading carries. Null means not judged.
        outOfRange:
          type: boolean

    MarkerSamplesCompactResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarkerSampleCompact"
        truncated:
          type: boolean
          description: True when more readings existed in the window than were read or returned; the answer may be missing older readings. Say so, and narrow the markers or the window.
        unmatchedIds:
          type: array
          nullable: true
          items:
            type: string

    PagedObservations:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObservationDto"
        totalCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean

    PrintedReferenceRange:
      type: object
      description: >-
        A range that arrived with a reading, typically the lab report's own, converted to the
        reading's unit.
      properties:
        type:
          type: string
          description: The kind of range. Ranges stored today carry "Custom"; it does not name the source.
        segments:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceRangeSegment"

    ReferenceRangeSegment:
      type: object
      description: One band of a reference range, e.g. "Normal" between `min` and `max`.
      properties:
        min:
          type: number
          nullable: true
          description: Lower bound. Null when the band is open below.
        max:
          type: number
          nullable: true
          description: Upper bound. Null when the band is open above.
        operator:
          type: string
          nullable: true
          description: Comparison for the band, e.g. `<`, `>` or `=`.
        label:
          type: string
          description: Display label of the band, e.g. "Normal" or "High".
        gender:
          type: string
          nullable: true
          description: Sex the band applies to, e.g. "Male" or "Female". Null when it applies to both.

    AppliedReferenceRange:
      type: object
      description: |
        The reference range the practice applies to this patient's result, filtered by sex
        and converted to the sample's unit. `source` says where it came from. Not the range printed on the
        lab report, which is `metaData.referenceRange`.
      properties:
        rangeId:
          type: string
          format: uuid
          description: Id of the winning range row. Traceability only.
        source:
          type: string
          enum: [Platform, Org, Cohort, Patient]
          description: |
            Where the range came from: `Platform` (the system default), `Org` (the
            practice's default), `Cohort` (a group the patient belongs to) or `Patient`
            (set for this person individually). Serialised as the name, not a number.
        cohortId:
          type: string
          format: uuid
          nullable: true
          description: The winning cohort. Set only when `source` is `Cohort`.
        cohortName:
          type: string
          nullable: true
          description: The winning cohort's display name. Set only when `source` is `Cohort`.
        unit:
          type: string
          nullable: true
          description: Unit of the range, after any measurement-system conversion.
        segments:
          type: array
          nullable: true
          description: The range's bands, already filtered to the patient's sex.
          items:
            $ref: "#/components/schemas/ReferenceRangeSegment"

    ObservationSample:
      type: object
      description: One raw measurement sample.
      properties:
        id:
          type: string
          format: uuid
          description: Sample ID
        unit:
          type: string
          nullable: true
          description: Unit of `value`, after any measurement-system conversion.
        canonicalUnit:
          type: string
          nullable: true
          description: |
            Normalised spelling of `unit`. Compare this, not `unit`, to decide whether two
            samples share a unit. Null only when the sample has no unit.
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        value:
          type: number
          description: Numeric value. Read `textValue` instead when `isTextResult` is true.
        valueHighPrecision:
          type: number
          nullable: true
          description: Higher-precision value. After a unit conversion it equals `value`.
        secondValue:
          type: number
          nullable: true
          description: Second component of a paired reading, such as diastolic blood pressure.
        secondUnit:
          type: string
          nullable: true
          description: Unit of `secondValue`.
        healthKitQuantityId:
          type: string
          format: uuid
          nullable: true
          description: Always null on this endpoint.
        userId:
          type: string
          format: uuid
          description: Arii user ID this sample belongs to.
        observationId:
          type: string
          format: uuid
          nullable: true
          description: The observation this sample came from.
        observation:
          type: object
          nullable: true
          description: |
            The observation this sample came from, carrying its `id`, `type`, `date`,
            `startDate`, `endDate`, `source`, `metadata` and `dataSourceLogId`. Its other
            keys are present but not populated on this endpoint.
        textValue:
          type: string
          nullable: true
          description: The result as text, e.g. "Negative" or "<0.1".
        isTextResult:
          type: boolean
          description: |
            True when the result has no plottable number (a qualifier such as "<0.1", or
            plain text such as "Negative"). Report `textValue`, not `value`.
        externalCode:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        tags:
          type: array
          nullable: true
          items:
            type: string
        panel:
          type: string
          nullable: true
          description: Lab panel the result was reported under.
        metaData:
          type: object
          nullable: true
          description: |
            Arbitrary metadata key-value pairs. `referenceRange` here is the range printed
            on the lab report, not `appliedReferenceRange`.
        annotations:
          type: string
          nullable: true
        markerTypeId:
          type: string
          format: uuid
          nullable: true
          description: The marker type. This is what `specificMarkers` takes on every marker tool.
        systemReferenceRangeId:
          type: string
          format: uuid
          nullable: true
        markerType:
          type: object
          nullable: true
          description: |
            The marker type's definition, including its `name`. Its `systemReferenceRanges`
            are unresolved candidates in their stored unit; never judge a value against them.
        systemReferenceRange:
          type: object
          nullable: true
          description: Legacy form of the applied range. Read `appliedReferenceRange` instead.
        appliedReferenceRange:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AppliedReferenceRange"
          description: |
            The reference range the practice applies to this patient's result. Null when no
            range applies or when it could not be put in the sample's unit. Null alone does
            not mean the marker has no range; check `metaData.referenceRange` when present.
        connectorId:
          type: string
          nullable: true
          description: The record's id in the system it came from.
        deviceName:
          type: string
          nullable: true
        originalSource:
          type: string
          nullable: true
          description: The app or device that originally recorded the sample.
        dataSource:
          type: integer
          nullable: true
          description: Data source as its numeric code. Read `dataSourceName` for the name.
        dataSourceName:
          type: string
          nullable: true
          description: Data source name, e.g. "Fitbit".
        recordDate:
          type: string
          format: date
          description: The day the value was recorded. Read it before calling a value current.
        recordingOffsetMinutes:
          type: integer
          nullable: true
          description: Recording offset, in minutes.

    PagedObservationSamples:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObservationSample"
        totalCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        hasPreviousPage:
          type: boolean
        hasNextPage:
          type: boolean

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
      description: |
        API Key via X-API-Key. Some older endpoints may auto-translate Airia profile IDs
        to Arii user IDs under API Key auth only. Prefer explicit Arii user IDs; several
        newer endpoints do not support API Key at all.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer (including Airia Platform passthrough). Requires Arii user IDs in all
        user-scoped parameters — no Airia-profile to Arii-user auto-translation.
