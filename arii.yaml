openapi: 3.0.3
info:
  title: Arii Health Platform API
  version: "1.0.0"
  x-mcp-tool-prefix: Arii_MCP
  description: |
    Arii is a health and wellness platform for patient data, clinical notes, observations,
    medications, journaling, meals, and symptoms.

    ## LLM Agent Usage Guide

    **Primary workflows:**
    - Current numbers / lipids / on-target: `get_user_marker_types_with_data`, filter by
      category (e.g. "Lipids & Cardiovascular Risk"), then `get_marker_summary` with
      `specificMarkers` (goal is inline on each marker). Never fetch sample payloads.
    - Lab draw metadata (when was the last panel, observation id): `list_observations`
      with `Type=Lab` and **`IncludeHealthKitSamples=false` only**
    - Device metrics (steps, HR, sleep): Marker tools after `bulk_search_marker_types`
    - Clinical notes: `list_notes` / `get_note` (providers) or `get_shared_notes` (patients)
    - Logging: `create_meal`, `create_journal`, `create_user_symptom_details`,
      `create_medication`, `create_observation` (activities and workouts go here)

    **CRITICAL - User ID kinds (do not confuse these):**
    - **Arii user ID** (`UserDto.id` / `CurrentUserIdentityDto.id`): the internal Arii GUID
      used in path/query params (`userId`, `requestingUserId`, `SelectedUserId`,
      `RequestingUserId`, etc.). Under Bearer/passthrough, obtain it via `get_current_user`.
    - **Airia profile ID** (`airiaProfileId`): the Airia Platform profile GUID.
      Correlation only. It is **not** a valid Arii `userId`. Passing it as `userId`
      returns 404 ("No user found") under Bearer auth.
    - **Keycloak / IdP `sub`**: never an Arii `userId`.
    - **Active group ID** (`activeGroupId`): organization/practice GUID, not a user ID.

    **Common workflows:**
    - "Resolve my Arii user ID (Bearer/passthrough)" -> call **`get_current_user`**
      (`GET /api/v1/Users/me`) once and reuse the returned `id` as your Arii user ID.
      Do not guess from Airia profile ID / Keycloak `sub`. Optional: call `get_user`
      with that `id` to confirm `id` <-> `airiaProfileId`. `get_current_user` and
      `get_user` have no date of birth, sex, height, weight, or allergies; for those
      call **`get_user_preferences`** with the Arii user ID.
    - "How old is she / height / weight / allergies / dietary restrictions / timezone" ->
      `get_current_user` (self) or patient Arii ID -> **`get_user_preferences`**
      (send `X-Access-Context: group` when a provider reads a patient).
    - "Provider reading a patient" -> path `userId` = patient Arii ID from execution
      context; `requestingUserId` = **`get_current_user`.id**
    - "What are her current numbers / is she hitting her target?" ->
      `get_user_marker_types_with_data` (or `bulk_search_marker_types` when you already
      know metric names) then **`get_marker_summary`** with `specificMarkers`. The goal
      is already on each marker. Do not look for a separate goal tool.
    - "How are my lipids / cholesterol / LDL / HDL / triglycerides?" ->
      `get_current_user` -> **`get_user_marker_types_with_data`** -> keep rows where
      `category` is **"Lipids & Cardiovascular Risk"** and/or name/aliases match the
      question (advanced panels: NMR, ratios, ApoB, Lp(a) may have blank category) ->
      **`get_marker_summary`** with those marker type ids in `specificMarkers`. Do **not**
      call `list_observations` or `get_observation` with samples enabled.
    - "When was my last lab draw / which observation id?" -> `list_observations`
      (`Type=Lab`, **`IncludeHealthKitSamples=false`**). Sort by `date` descending.
      If you send `StartDate`/`EndDate`, they must end in `Z` or the API returns 400.
    - "Device / daily metrics (steps, HR, sleep)" -> Marker tools
      (`get_user_marker_types_with_data`, `get_marker_summary`, `get_marker_samples`,
      `get_marker_averages`).
    - "Log an activity or workout" -> `create_observation` with `type=Activity`.

    **Authentication:** Supports JWT Bearer tokens (passthrough from Airia Platform) and
    API Key via `X-API-Key`.
    - Under **Bearer / passthrough**, you MUST pass Arii user IDs. There is no automatic
      translation from Airia profile ID to Arii user ID. **Always call `get_current_user`
      first** to obtain the caller's Arii `id` (requires a linked Arii user for the JWT).
    - Airia profile ID to Arii user ID auto-translation exists **only for API Key auth**,
      and some newer endpoints do not support API Key at all. Prefer explicit Arii user
      IDs (from `get_current_user` under Bearer) so the same tool calls work for both.

    **Common patterns:**
    - Most user-scoped endpoints require an Arii `userId` (GUID)
    - Observation `StartDate`/`EndDate` must be UTC RFC3339 **with `Z`**
      (e.g., `2024-01-15T00:00:00Z`). Naive datetimes without `Z` cause HTTP 400.
      Marker summary, averages, and samples use local calendar dates `YYYY-MM-DD`.
    - Cross-user access requires family, sharing, or group permissions. Behavior is
      endpoint-specific. **Provider reading a patient:** DataDictionary and Marker
      tools require `X-Access-Context: group` (plus `requestingUserId` where required).
      Cross-user Observation reads have no reliable mechanism exposed by these tools;
      a 403 there is an access problem, not missing data. Prefer the Marker path for
      current lab values, and do not fall back to Observation sample payloads when
      Marker tools return 403.
    - The `X-Access-Context` header (value `"group"`) enables group-based access on
      DataDictionary and Marker endpoints; it is not sufficient alone for every
      cross-user Observation query

    **Pagination:** 0-based `pageNumber` and `pageSize` (typically 1-100).
    `list_observations` `PageSize` defaults to 10 and is rejected outside 1-100.

    **Errors:** `get_current_user` returns 401 if unauthenticated and 404 if the JWT has
    no linked Arii user. Wrong ID kind (Airia profile ID / Keycloak `sub` as `userId`)
    returns 404 under Bearer/passthrough. Some cross-user Observation queries return 400
    ("Tenant context required...") even with `X-Access-Context: group`.

    **IDs:** All entity IDs are GUIDs (e.g., `3fa85f64-5717-4562-b3fc-2c963f66afa6`).

servers:
  - url: https://dev.api.nicoya.health
    description: Nicoya dev environment (override per environment via ?u= on the gateway URL)

security:
  - apiKeyAuth: []
  - bearerAuth: []

tags:
  - name: Users
    description: |
      User identity. Under Bearer/passthrough, call `get_current_user` first
      to resolve the caller's Arii user ID before other user-scoped tools.
  - name: Journal
    description: Patient wellness journal entries
  - name: Meals
    description: Meal and nutrition tracking
  - name: Medications
    description: Medication prescriptions and adherence history
  - name: Notes
    description: Clinical and provider notes for patients
  - name: Observations
    description: Health observations (labs, activities, assessments, appointments, and summaries)
  - name: Documents
    description: Health documents with AI-powered feature extraction
  - name: Symptoms
    description: Symptom tracking and reporting
  - name: Markers
    description: Health marker summaries, averages, and raw samples (aggregated health data)
  - name: MarkerTypes
    description: Marker type (biomarker/metric) definitions and lookup
  - name: DataDictionary
    description: Per-user data dictionary (which marker types a user has data for)

paths:
  # ===================
  # USER ENDPOINTS
  # ===================
  /api/v1/Users/me:
    get:
      tags: [Users]
      operationId: get_current_user
      summary: Get the authenticated caller's Arii identity
      description: |
        **Never2 Never Call this first under Bearer/passthrough** before any tool that needs an Arii
        `userId` or `requestingUserId`. Resolves the caller from the bearer token.

        Returns `id`, `airiaProfileId`, `firstName`, `lastName`, `email`, `isVerified`,
        and `activeGroupId`. The `id` field is the Arii user ID. Reuse it for later
        calls. `airiaProfileId` is correlation with Airia Platform only; it is **not**
        valid as path/query `userId` under Bearer.

        Carries no demographics: no date of birth, sex, height, or weight. Those live
        on user preferences: call `get_user_preferences` with the returned `id`.

        No path parameters. Identity comes from the Bearer token. 401 if
        unauthenticated; 404 if the token has no linked Arii user.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      responses:
        "200":
          description: Authenticated caller's Arii identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserIdentityDto"
        "401":
          description: Missing or invalid Bearer token
        "404":
          description: Valid token but no linked Arii user, or linked user row missing

  /api/v1/Users/{userId}:
    get:
      tags: [Users]
      operationId: get_user
      summary: Get a user by Arii user ID
      description: |
        Returns one user's account record: names, email, verification flag, active
        group, `airiaProfileId`, and last sync timestamps for Apple Health, Garmin,
        and Health Connect. Use it to check whether a device is still feeding data.

        **Requires an Arii user ID** (`UserDto.id`), not an Airia Platform profile ID.
        Passing an Airia profile ID returns 404 under Bearer/passthrough auth.

        For **your own** profile under Bearer: call `get_current_user` first and pass
        its returned `id` here. For another user: use their Arii user ID from agent
        execution context, never an Airia profile ID.

        `UserDto` has no date of birth or sex. Demographics live on user preferences:
        use `get_user_preferences` with the same `userId`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            Arii user ID (`UserDto.id` GUID). For self under Bearer, use
            `get_current_user`.id. Do not pass an Airia profile ID, Keycloak `sub`,
            or group ID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
  # NOTE: DELETE /api/v1/Users/{userId} is intentionally not exposed as an MCP tool.
  # Permanent user deletion is a privileged operation and must be performed through
  # the Arii UI, not by an agent.

  /api/v3/UserPreferences/{userId}:
    get:
      tags: [Users]
      operationId: get_user_preferences
      summary: Get a user's profile preferences and demographics
      description: |
        Returns the user's preference record: demographics (`dateOfBirth` as
        `YYYY-MM-DD`, `sex`, `height`/`heightUnit`, `weight`/`weightUnit`), names,
        phone, `aboutMe`, `timeZoneIdentifier`, `useMetricSystem`, preferred health
        data source, allergies, dietary preferences, and goals.

        **Use this for:** "How old is she / what is his date of birth?", "What is my
        height / weight / BMI inputs?", "Does the patient have allergies or dietary
        restrictions?", "Which timezone / unit system does the user use?".
        `get_current_user` and `get_user` do **not** carry any of this.

        **Requires an Arii user ID** (`UserDto.id`), not an Airia profile ID.
        For self under Bearer: call `get_current_user` first and pass its `id`.
        **Provider reading a patient:** pass the patient's Arii user ID and send
        `X-Access-Context: group`; otherwise share/family permissions are checked
        and a 403 means missing access, not missing data. Shared fields may be
        filtered by the granting user's permissions.

        Enum fields are integers: `sex` 0=Male, 1=Female, 2=Other.
        `preferredDataSource` 0=Arii, 1=Fitbit, 2=Oura, 3=Withings, 4=AppleHealth,
        5=Garmin, 6=Whoop (see schema for the full list); prefer
        `preferredDataSourceName` when present.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            Arii user ID (`UserDto.id` GUID). For self under Bearer, use
            `get_current_user`.id. Do not pass an Airia profile ID, Keycloak `sub`,
            or group ID.
          schema:
            type: string
            format: uuid
        - name: X-Access-Context
          in: header
          required: false
          description: |
            Set to `group` when a provider/team member reads a patient in their
            organization. Omit for self or family/share-based access.
          schema:
            type: string
            enum: [group]
      responses:
        "200":
          description: User preferences and demographics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesDto"
        "403":
          description: Caller lacks family, share, or group permission to read this user's profile
        "404":
          description: No preferences exist for this user, or wrong ID kind (Airia profile ID / Keycloak `sub`)

  # ===================
  # JOURNAL ENDPOINTS
  # ===================
  /api/v1/Journal/{userId}:
    get:
      tags: [Journal]
      operationId: get_user_journals
      summary: Get journal entries for a user
      description: |
        Journal entries for a day or range with title, content, image URLs, and
        structured activity responses. Use for how the patient described feeling.

        Filters on `date` or `startDate`/`endDate` only. There is no local-calendar
        record-date option, unlike meals.

        Path `userId` must be an Arii user ID. For self under Bearer, use
        `get_current_user`.id.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: date
          in: query
          description: Filter by specific date (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: startDate
          in: query
          description: Filter start date (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter end date (ISO 8601).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalDto"

  /api/v1/Journal/journal/{journalId}:
    get:
      tags: [Journal]
      operationId: get_journal
      summary: Get a journal entry by ID
      description: One journal entry in full.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: journalId
          in: path
          required: true
          description: The journal entry ID (GUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Journal entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalDto"

  /api/v1/Journal:
    post:
      tags: [Journal]
      operationId: create_journal
      summary: Create a new journal entry
      description: |
        Creates a journal entry. Required: `userId` and `journalDate`. Call only when
        the user asked for something to be logged.

        Images go in as base64 via `imageBase64List`; the read side returns URLs instead.
      x-mcp-annotations:
        readOnlyHint: false
        idempotentHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalUpsertDto"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalDto"

  # ===================
  # MEAL ENDPOINTS
  # ===================
  /api/v1/Meals/{userId}:
    get:
      tags: [Meals]
      operationId: get_user_meals
      summary: Get all meals for a user
      description: |
        Logged meals for a day or range with portion size, metric and imperial serving
        sizes, nutrition samples, and any co-eaters.

        Accepts `date`, `startDate`/`endDate`, or `recordStartDate`/`recordEndDate`.
        Prefer the record dates, which are the patient's local calendar days.

        Path `userId` must be an Arii user ID. For self under Bearer, use
        `get_current_user`.id.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: date
          in: query
          description: Filter by specific date (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: startDate
          in: query
          description: Filter start date inclusive (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter end date inclusive (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: recordStartDate
          in: query
          description: Patient local calendar start day (YYYY-MM-DD). Prefer this pair over startDate/endDate.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          description: Patient local calendar end day (YYYY-MM-DD). Prefer this pair over startDate/endDate.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealDto"

  /api/v1/Meals/meal/{mealId}:
    get:
      tags: [Meals]
      operationId: get_meal
      summary: Get a specific meal by ID
      description: One meal with its nutrition breakdown, image, and associated users.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: mealId
          in: path
          required: true
          description: The meal ID (GUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Meal details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealDto"

  /api/v1/Meals:
    post:
      tags: [Meals]
      operationId: create_meal
      summary: Create a new meal
      description: |
        Records a meal the user reported: name, description, date and local record date,
        portion size, metric and imperial serving sizes, optional nutrition samples, and
        the users it applies to. Call only when the user asked for something to be logged.
      x-mcp-annotations:
        readOnlyHint: false
        idempotentHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealUpsertDto"
      responses:
        "201":
          description: Created meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealDto"

  # ===================
  # MEDICATION ENDPOINTS
  # ===================
  /api/v1/Medications/user/{userId}:
    post:
      tags: [Medications]
      operationId: create_medication
      summary: Create a new medication for a user
      description: |
        Adds a medication with name, type, dose value and unit, and a **required
        schedule**, which generates the forward dose log that adherence reads report
        on. Call only when the user asked for something to be logged.

        `requestingUserId` is required in the body. Without a valid schedule there is
        nothing for `get_medication_history` to return.
      x-mcp-annotations:
        readOnlyHint: false
        idempotentHint: false
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestingUserId, name, schedule]
              description: Medication creation request
              properties:
                requestingUserId:
                  type: string
                  format: uuid
                  description: |
                    Arii user ID of the caller. Pass `get_current_user`.id. Not an
                    Airia profile ID.
                name:
                  type: string
                  description: Medication name
                medicationType:
                  type: string
                  description: Medication form (e.g. Tablet, Liquid, Lotion, Inhaler).
                doseValue:
                  type: number
                  description: Numeric dose amount.
                doseUnit:
                  type: string
                  description: Dose unit (e.g. Mg, Ml, Iu).
                schedule:
                  $ref: "#/components/schemas/MedicationScheduleDto"
                isActive:
                  type: boolean
                  description: Whether the medication is currently active. Defaults to true on the API.
                nickname:
                  type: string
                  description: Optional display nickname.
                notes:
                  type: string
                  description: Additional notes
      responses:
        "201":
          description: Created medication

  /api/v1/user-products/user/{userId}/history/logs:
    get:
      tags: [Medications]
      operationId: get_medication_history
      summary: Get medication adherence history for a user
      description: |
        Scheduled doses over a range with scheduled date and time, dose count, status,
        when it was actually taken, schedule type, and instructions. This is the
        adherence read, not the current medication list.

        `requestingUserId` is required. `type` is pinned to Medication. Path `userId`
        is the patient; for self under Bearer, pass `get_current_user`.id as both
        path `userId` and `requestingUserId`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - name: type
          in: query
          required: true
          description: Product type. This tool is the medication adherence read; always Medication.
          schema:
            type: string
            enum: [Medication]
            default: Medication
        - name: startDate
          in: query
          description: Filter start date (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter end date (ISO 8601).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Medication dose history logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProductHistoryLogDto"

  # ===================
  # NOTE ENDPOINTS
  # ===================
  /api/v1/Notes:
    get:
      tags: [Notes]
      operationId: list_notes
      summary: List notes with pagination and filters
      description: |
        Paged clinical notes with title, date, content, categories, attached patients,
        draft state, and author. Filter by creator, patient, private flag, archive
        state, category, or free text.

        Drafts are included by default (`includeDrafts=true`); pass false for
        finalized notes only. This is the provider-facing list. Patients should use
        `get_shared_notes`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: pageNumber
          in: query
          description: Page number (0-based, default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Page size (1-100, default 20).
          schema:
            type: integer
            default: 20
        - name: includeDrafts
          in: query
          description: Include draft notes (default true).
          schema:
            type: boolean
            default: true
        - name: createdBy
          in: query
          description: Filter by creator user ID (GUID).
          schema:
            type: string
            format: uuid
        - name: patientId
          in: query
          description: |
            Filter by the patient's Arii user ID (`UserDto.id` GUID) — not an Airia
            profile ID. For notes about yourself, pass your own `get_current_user`.id.
          schema:
            type: string
            format: uuid
        - name: isArchived
          in: query
          description: Filter by archived status.
          schema:
            type: boolean
        - name: search
          in: query
          description: Search text to filter by title or content.
          schema:
            type: string
        - name: categories
          in: query
          description: Filter by category names (comma-separated).
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Paginated notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedNotes"
  /api/v1/Notes/shared:
    get:
      tags: [Notes]
      operationId: get_shared_notes
      summary: Get notes shared with the current user
      description: |
        Notes shared with the user, with who shared them and when. The correct
        patient-facing note read: a patient sees only these.

        Returns a plain list, not a page. There is no `pageNumber` here.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: query
          description: |
            Arii user ID (`UserDto.id` GUID) whose shared notes to fetch — not an Airia
            profile ID. Prefer passing `get_current_user`.id explicitly rather than
            relying on the server to infer the caller.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of shared notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteDto"

  /api/v1/Notes/{id}:
    get:
      tags: [Notes]
      operationId: get_note
      summary: Get a note by ID
      description: |
        One clinical note in full, including its version, draft state, categories, and
        the patients it is attached to.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: id
          in: path
          required: true
          description: The note ID (GUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Note details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDto"

  # ===================
  # OBSERVATION ENDPOINTS (v2)
  # ===================
  /api/v2/Observation:
    get:
      tags: [Observations]
      operationId: list_observations
      summary: List observations with filters and pagination
      description: |
        Paged observation **containers** filtered by type (17 values including Lab,
        Activity, SleepSummary, Assessment, Appointment, BodyCompositionSummary, and
        Recovery) plus subtype, source, user, and date. Use for draw dates, ids, and
        metadata — not for current biomarker values.

        **Do not set `IncludeHealthKitSamples=true`.** Each sample embeds a full
        `markerType` and parent `observation`; a single lab panel can exceed context
        limits. For lipids and current lab numbers use `get_user_marker_types_with_data`
        then `get_marker_summary` with `specificMarkers`. `PageSize` defaults to 10
        and is rejected outside 1-100.

        `UserId` must be an Arii user ID. For self under Bearer, pass
        `get_current_user`.id.

        **Dates:** `StartDate` and `EndDate` MUST be UTC RFC3339 with a trailing `Z`
        (example: `2026-08-01T00:00:00Z`). Values like `2020-01-01T00:00:00` (no `Z`)
        cause HTTP 400. If a 400 mentions DateTime Kind / timestamptz / Unspecified,
        retry with both dates omitted. If it says "Tenant context required", that is
        an access error, not missing labs.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: UserId
          in: query
          description: |
            Filter by Arii user ID. For self, use `get_current_user`.id. Do not pass
            an Airia profile ID.
          schema:
            type: string
            format: uuid
        - name: Type
          in: query
          description: "Filter by observation type: Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery."
          schema:
            type: string
            enum: [Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery]
        - name: SubType
          in: query
          description: Filter by observation sub-type.
          schema:
            type: string
        - name: Source
          in: query
          description: Filter by data source (exact match, e.g., "Oura", "Fitbit", "Garmin").
          schema:
            type: string
        - name: StartDate
          in: query
          description: |
            Inclusive range start. UTC RFC3339 **with `Z` only**, e.g. `2026-08-01T00:00:00Z`.
            Omit this (and EndDate) unless a date window is required. Naive ISO datetimes
            without `Z` (e.g. `2020-01-01T00:00:00`) return HTTP 400.
          schema:
            type: string
            format: date-time
        - name: EndDate
          in: query
          description: |
            Inclusive range end. UTC RFC3339 **with `Z` only**, e.g. `2026-08-18T23:59:59Z`.
            Omit this (and StartDate) unless a date window is required. Naive ISO datetimes
            without `Z` return HTTP 400.
          schema:
            type: string
            format: date-time
        - name: PageNumber
          in: query
          description: Page number (0-based).
          schema:
            type: integer
            default: 0
        - name: PageSize
          in: query
          description: Page size (1-100, default 10). Rejected outside that range.
          schema:
            type: integer
            default: 10
        - name: IncludeHealthKitSamples
          in: query
          description: |
            Include HealthKit quantity samples on each listed observation (default
            false). **Leave false.** True repeats huge nested sample payloads per row
            and can blow the model context. Use Marker tools for values.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedObservations"
    post:
      tags: [Observations]
      operationId: create_observation
      summary: Create a new observation
      description: |
        Records an observation of any of the 17 types (Lab, Activity, SleepSummary,
        Assessment, Appointment, BodyCompositionSummary, Recovery, and the rest)
        with optional nested measurement samples. The correct home for activities
        and workouts. Call only when the user asked for something to be logged.

        Needs `type` and `source`. Measurements go in `healthKitQuantitySamples`,
        each carrying `markerTypeId`, `recordDate`, `value`, and `unit`.
      x-mcp-annotations:
        readOnlyHint: false
        idempotentHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationCreateDto"
      responses:
        "201":
          description: Created observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationDto"

  /api/v2/Observation/{id}:
    get:
      tags: [Observations]
      operationId: get_observation
      summary: Get an observation by ID
      description: |
        One observation container with metadata, tags, and `sampleCount`. Use only when
        you already have an observation id from a cheap `list_observations` call and
        need container-level fields — not for "how are my lipids?" or other current-value
        questions.

        **Do not set `includeHealthKitSamples=true`.** It returns every sample on the
        panel with nested `markerType` and `observation` objects (hundreds of KB). For
        lab values use `get_user_marker_types_with_data` then `get_marker_summary` with
        `specificMarkers`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: id
          in: path
          required: true
          description: The observation ID (GUID).
          schema:
            type: string
            format: uuid
        - name: includeHealthKitSamples
          in: query
          description: |
            Include HealthKit quantity samples (default false). **Leave false** unless
            debugging a specific observation id; payloads are very large.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Observation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationDto"
  # ===================
  # DOCUMENT ENDPOINTS (v2)
  # ===================
  /api/v2/Documents:
    get:
      tags: [Documents]
      operationId: get_user_documents
      summary: Get documents for a user with extracted features
      description: |
        Uploaded documents with download URL, category, lab provider, observation date,
        extraction status, and the AI-extracted features. Use for "what did the lab
        report she uploaded say?".

        Returns a plain list, not a page. The approved / pending / rejected feature
        counts tell you whether extraction is still under human review.

        `SelectedUserId` and `RequestingUserId` must be Arii user IDs. Call
        `get_current_user` first and use its `id` as `RequestingUserId` (and as
        `SelectedUserId` when reading your own documents).
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: SelectedUserId
          in: query
          required: true
          description: |
            Arii user ID whose documents to retrieve. For self, use
            `get_current_user`.id. Not an Airia profile ID.
          schema:
            type: string
            format: uuid
        - name: RequestingUserId
          in: query
          description: |
            Arii user ID of the caller for permission checks. **Call `get_current_user`
            and pass its returned `id`.**
          schema:
            type: string
            format: uuid
        - name: documentId
          in: query
          description: Filter to a specific document ID (GUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Documents with extracted features

  /api/v1/symptoms:
    get:
      tags: [Symptoms]
      operationId: list_symptoms
      summary: List all available symptoms
      description: |
        The catalog of trackable symptoms. Resolve a symptom here before reading or
        logging one, since the log body embeds the whole symptom object rather than
        a name.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      responses:
        "200":
          description: List of available symptoms

  /api/v1/users/{userId}/symptom-details:
    get:
      tags: [Symptoms]
      operationId: get_user_symptom_details
      summary: Get symptom details for a user
      description: |
        Logged symptoms with intensity, duration, notes, images, and an optional body
        drawing, over an optional date range.

        `requestingUserId` is required, not optional. There is no frequency field.
        Intensity and duration are what gets recorded.

        Path `userId` must be an Arii user ID. For self, use `get_current_user`.id as
        both path `userId` and `requestingUserId`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            Arii user ID whose symptom details to retrieve. For self, use
            `get_current_user`.id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - name: startDate
          in: query
          description: Filter start date (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter end date (ISO 8601).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: User symptom details
    post:
      tags: [Symptoms]
      operationId: create_user_symptom_details
      summary: Create symptom details for a user
      description: |
        Logs one or more symptoms. The body is a JSON **array**, and each item needs
        the symptom object, an intensity, and a start date; duration, notes, and
        images are optional. Call only when the user asked for something to be logged.

        `requestingUserId` is a required query parameter, separate from the path
        `userId`. Resolve the symptom with `list_symptoms` first. The body embeds the
        whole symptom object, not just a name.
      x-mcp-annotations:
        readOnlyHint: false
        idempotentHint: false
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: requestingUserId
          in: query
          description: |
            Arii user ID of the caller, used for authorization scoping. **Call
            `get_current_user` and pass its returned `id`.** Not an Airia profile ID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: |
                JSON array of symptom detail objects. Example:
                [{"symptom":{"name":"Headache"},"intensity":5,"startDate":"2026-07-20T00:00:00Z","notes":"..."}]
              items:
                type: object
                required: [symptom, intensity, startDate]
                properties:
                  symptom:
                    type: object
                    description: Symptom reference — include id and/or name from list_symptoms.
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Symptom catalog ID (GUID), if known.
                      name:
                        type: string
                        description: Symptom name.
                      category:
                        type: string
                        description: Symptom category.
                  intensity:
                    type: integer
                    minimum: 0
                    maximum: 10
                    description: Intensity on a 0-10 scale.
                  startDate:
                    type: string
                    format: date-time
                    description: When the symptom started (ISO 8601).
                  notes:
                    type: string
                    description: Optional notes (max 500 chars).
                  images:
                    type: array
                    items:
                      type: string
                    description: Optional base64-encoded images.
      responses:
        "201":
          description: Created symptom details

  # ===================
  # MARKER ENDPOINTS (v2)
  # ===================
  /api/v2/Marker/summary/{userId}:
    get:
      tags: [Markers]
      operationId: get_marker_summary
      summary: Get health marker summary for a user
      description: |
        Latest value per biomarker over a date window, each with unit, reference
        range, display precision, data source, and **the patient's goal for that
        marker inline**. The default read for "what are her current numbers?",
        **"how are my lipids?"**, and "is she hitting her target?".

        Requires `requestingUserId`. Dates are `recordStartDate`/`recordEndDate` as
        `YYYY-MM-DD`. Narrow with `specificMarkers` (marker type IDs from
        `get_user_marker_types_with_data` or `bulk_search_marker_types`). A returned
        value may have been carried forward from up to a year earlier.

        Lipids flow: `get_user_marker_types_with_data` -> filter category **"Lipids &
        Cardiovascular Risk"** (and name/alias match for uncategorized advanced lipids)
        -> this tool with those ids in `specificMarkers`. One flat row per marker, not
        one row per sample.

        Both path `userId` and `requestingUserId` must be Arii user IDs. Call
        `get_current_user` first. Provider reads need `X-Access-Context: group`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            Arii user ID whose markers to summarize. For self, use `get_current_user`.id.
            For a patient, use their Arii user ID — not an Airia profile ID.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - name: recordStartDate
          in: query
          required: true
          description: |
            Start date as a local calendar date (YYYY-MM-DD). Required together with
            recordEndDate — the API returns 400 if either is omitted.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          required: true
          description: |
            End date as a local calendar date (YYYY-MM-DD). Required together with
            recordStartDate — the API returns 400 if either is omitted.
          schema:
            type: string
            format: date
        - name: specificMarkers
          in: query
          description: Optional list of marker type IDs (GUIDs) to filter to. Must be non-empty if provided.
          schema:
            type: array
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: Marker summary data

  /api/v2/Marker/averages/{userId}:
    get:
      tags: [Markers]
      operationId: get_marker_averages
      summary: Get health marker averages for a user
      description: |
        Paged averages per marker type: daily, weekday and weekend means, highest
        single day, high and low range, plus per-day logs and chart points. Use for
        trends and period comparisons.

        Requires `requestingUserId`; `pageSize` defaults to 20. The goal value is
        included here too, so "on track?" needs no separate goal call. Dates are
        `recordStartDate`/`recordEndDate` as `YYYY-MM-DD`.

        Both path `userId` and `requestingUserId` must be Arii user IDs. Call
        `get_current_user` first. Provider reads need `X-Access-Context: group`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            Arii user ID whose marker averages to fetch. For self, use
            `get_current_user`.id. Not an Airia profile ID.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - name: recordStartDate
          in: query
          required: true
          description: |
            Start date as a local calendar date (YYYY-MM-DD). Required together with
            recordEndDate — the API returns 400 if either is omitted.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          required: true
          description: |
            End date as a local calendar date (YYYY-MM-DD). Required together with
            recordStartDate — the API returns 400 if either is omitted.
          schema:
            type: string
            format: date
        - name: specificMarkers
          in: query
          description: Optional list of marker type IDs (GUIDs) to filter to. Must be non-empty if provided.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: pageNumber
          in: query
          description: Zero-based page number (default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Number of marker types per page (default 20).
          schema:
            type: integer
            default: 20
        - name: useWeeklyAggregation
          in: query
          description: |
            Optional override for weekly vs daily chart bucketing. Omit to use the
            default (~90-day threshold decides bucketing automatically).
          schema:
            type: boolean
      responses:
        "200":
          description: Marker averages data

  /api/v2/Marker/samples/{userId}:
    get:
      tags: [Markers]
      operationId: get_marker_samples
      summary: Get raw marker samples for a user
      description: |
        Individual measurements with value, unit, source, timestamps, and tags, paged
        100 at a time. Use when averages are too coarse: one specific reading, or
        variation within a single day.

        Requires `recordStartDate`/`recordEndDate` (`YYYY-MM-DD`). Unlike summary and
        averages it takes no `requestingUserId`, so cross-user access rides on
        `X-Access-Context` alone.

        Path `userId` must be an Arii user ID. For raw sample history prefer
        `specificMarkers` to limit payload size.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            Arii user ID whose samples to fetch. For self, use `get_current_user`.id.
            Not an Airia profile ID.
          schema:
            type: string
            format: uuid
        - name: recordStartDate
          in: query
          required: true
          description: |
            Start date as a local calendar date (YYYY-MM-DD). Required together with
            recordEndDate — the API returns 400 if either is omitted.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          required: true
          description: |
            End date as a local calendar date (YYYY-MM-DD). Required together with
            recordStartDate — the API returns 400 if either is omitted.
          schema:
            type: string
            format: date
        - name: specificMarkers
          in: query
          description: Optional list of marker type IDs (GUIDs) to filter to. Must be non-empty if provided.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: pageNumber
          in: query
          description: Zero-based page number (default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Number of samples per page, 1-1000 (default 100).
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Paginated raw marker samples

  # ===================
  # NOTE CATEGORY ENDPOINTS
  # ===================
  /api/v1/note-categories:
    get:
      tags: [Notes]
      operationId: list_note_categories
      summary: List all note categories
      description: |
        The category vocabulary notes can be filed under. Use it to turn a category
        name into the value `list_notes` expects.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      responses:
        "200":
          description: List of note categories

  # ===================
  # MARKER TYPE ENDPOINTS (v2)
  # ===================
  /api/v2/MarkerType:
    get:
      tags: [MarkerTypes]
      operationId: list_marker_types
      summary: List marker types with filtering and pagination
      description: |
        Paged marker definitions with SI and conventional units, conversion factor,
        acceptable units, LOINC and SNOMED codes, display precision, and system
        reference ranges. The read for "what is the normal range for ApoB?".

        `pageSize` defaults to 10. Filter with `search`, `name`, `category`, `tags`,
        or `labProvider` rather than paging through. To resolve a named metric to an
        ID, prefer `bulk_search_marker_types`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: search
          in: query
          description: Filter by name containing this string.
          schema:
            type: string
        - name: name
          in: query
          description: Exact name filter.
          schema:
            type: string
        - name: category
          in: query
          description: Exact category filter.
          schema:
            type: string
        - name: tenantId
          in: query
          description: Fetch marker types for a specific tenant/group (GUID).
          schema:
            type: string
            format: uuid
        - name: includeDefault
          in: query
          description: If true, include marker types with no tenantId (system defaults). Default true.
          schema:
            type: boolean
            default: true
        - name: withQuantityType
          in: query
          description: |
            Optional filter on whether QuantityType is set. true = only marker types
            with a non-null QuantityType; false = only marker types where QuantityType
            is null; omit to return both.
          schema:
            type: boolean
        - name: tags
          in: query
          description: Filter by tags.
          schema:
            type: array
            items:
              type: string
        - name: labProvider
          in: query
          description: Filter by lab provider.
          schema:
            type: string
        - name: includeAllTags
          in: query
          description: If true, include all tags in the response.
          schema:
            type: boolean
        - name: excludeCategories
          in: query
          description: Category IDs to exclude from results.
          schema:
            type: array
            items:
              type: string
        - name: pageNumber
          in: query
          description: Page number (0-based, default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Page size (default 10).
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated marker types
  /api/v2/MarkerType/lookup:
    get:
      tags: [MarkerTypes]
      operationId: lookup_marker_types
      summary: Dump the entire marker type catalog (minimal fields)
      description: |
        Returns the whole marker-type lookup table (every id, name, alternate name,
        and category) with no filter and no paging. Only for "what metrics exist at
        all?".

        Takes only `tenantId` and `includeDefault`. Roughly 2,400 entries. Use
        `bulk_search_marker_types` to resolve a named metric.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: tenantId
          in: query
          description: Optional tenant/group ID (GUID) to filter by.
          schema:
            type: string
            format: uuid
        - name: includeDefault
          in: query
          description: If true, also include system marker types with no tenantId. Default true.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of marker types (minimal fields)
    post:
      tags: [MarkerTypes]
      operationId: bulk_search_marker_types
      summary: Resolve marker names to marker type IDs (preferred lookup)
      description: |
        Takes a list of keywords and returns matching marker types grouped per
        keyword, each with id, canonical name, alternate names, and category. Run it
        once with every metric named in the question, then pass the ids to the Marker
        tools.

        The response is keyed by your keyword, so an empty array for one keyword means
        that metric is unknown to the catalog, not that the patient has no data for it.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                  description: Search keywords to look up marker types for.
                tenantId:
                  type: string
                  format: uuid
                  description: Optional tenant/group ID (GUID) to filter by.
                includeDefault:
                  type: boolean
                  description: Whether to include default (null tenant) marker types.
      responses:
        "200":
          description: Marker types grouped by keyword

  /api/v2/MarkerType/{id}:
    get:
      tags: [MarkerTypes]
      operationId: get_marker_type
      summary: Get a marker type by ID
      description: |
        One marker definition with its units, conversion factor, clinical codes, and
        reference ranges.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: id
          in: path
          required: true
          description: The marker type ID (GUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Marker type details

  # ===================
  # DATA DICTIONARY ENDPOINTS (v2)
  # ===================
  /api/v2/Users/{userId}/DataDictionary/MarkerTypes:
    get:
      tags: [DataDictionary]
      operationId: get_user_marker_types_with_data
      summary: List marker types a user has data for
      description: |
        The marker types this patient actually has samples for, each with id, name,
        category, unit, and aliases. **Step 1 for lipids and current lab values:**
        filter here (e.g. `category` == "Lipids & Cardiovascular Risk", plus
        name/alias match for advanced lipid markers with blank category), then pass
        the ids to `get_marker_summary` as `specificMarkers`.

        Names only: no values and no ranges. Results include marker types the
        dashboard may hide. Path `userId` must be an Arii user ID. Provider reads
        need `X-Access-Context: group`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            Arii user ID whose data dictionary to query. For self, use
            `get_current_user`.id. Not an Airia profile ID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Marker types the user has data for

components:
  parameters:
    # Canonical Arii user-ID parameters. Kept here so the ID-kind guidance has a
    # single source of truth instead of drifting across ~30 inline copies.
    # Endpoints whose ID has narrower meaning (e.g. a patient rather than the
    # caller) keep their own inline description.
    AriiUserIdPath:
      name: userId
      in: path
      required: true
      description: |
        Arii user ID (`UserDto.id` GUID) this operation applies to. For yourself, use
        `get_current_user`.id; for another user, their Arii ID from execution context.
        Never an Airia profile ID, Keycloak `sub`, or group ID: those return 404
        "No user found" under Bearer auth.
      schema:
        type: string
        format: uuid
    AriiRequestingUserIdQuery:
      name: requestingUserId
      in: query
      required: true
      description: |
        Arii user ID of the authenticated caller, used for authorization scoping.
        **Call `get_current_user` and pass its returned `id`.** Not an Airia
        profile ID and not a Keycloak `sub`.
      schema:
        type: string
        format: uuid

  schemas:
    CurrentUserIdentityDto:
      type: object
      description: |
        Safe identity fields from `get_current_user` (`GET /api/v1/Users/me`).
        Narrower than UserDto — no image, anchors, or sync timestamps.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Arii user ID of the authenticated caller. Reuse this as `userId` /
            `requestingUserId` / `RequestingUserId` on subsequent Bearer tool calls.
        airiaProfileId:
          type: string
          format: uuid
          description: |
            Airia Platform profile ID for correlation only — not valid as Bearer path
            `userId` (profile → Arii translation is API Key only).
        email:
          type: string
          description: Caller's email address
        firstName:
          type: string
          description: Caller's first name
        lastName:
          type: string
          description: Caller's last name
        isVerified:
          type: boolean
          description: Whether the caller's email is verified
        activeGroupId:
          type: string
          format: uuid
          description: Caller's active Arii group/organization ID (not a user ID)

    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: |
            Arii user ID — the only GUID valid for path/query `userId`,
            `requestingUserId`, `SelectedUserId`, and `RequestingUserId` under
            Bearer/passthrough auth.
        airiaProfileId:
          type: string
          format: uuid
          description: |
            Linked Airia Platform profile ID. Correlation only — never substitute
            this value for Arii `userId` parameters when using Bearer/passthrough
            (API Key auth may auto-translate on some older endpoints; do not rely
            on that for MCP passthrough).
        firstName:
          type: string
          description: First name
        middleName:
          type: string
          description: Middle name
        lastName:
          type: string
          description: Last name
        email:
          type: string
          description: Email address
        isVerified:
          type: boolean
          description: Whether the user's email is verified
        activeGroupId:
          type: string
          format: uuid
          description: Active group/organization ID (not a user ID)

    UserPreferencesDto:
      type: object
      description: |
        User profile preferences and demographics. Enums are serialized as integers.
        `dateOfBirth` is a calendar date `YYYY-MM-DD` (no time component).
      properties:
        userId:
          type: string
          format: uuid
          description: Arii user ID this preference record belongs to
        firstName:
          type: string
          nullable: true
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          description: Deprecated full name; prefer firstName/middleName/lastName
        aboutMe:
          type: string
          nullable: true
          description: Free-text "about me" written by the user (max 800 chars)
        sex:
          type: integer
          enum: [0, 1, 2]
          description: "Biological sex: 0=Male, 1=Female, 2=Other"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Date of birth as `YYYY-MM-DD`
        height:
          type: number
          nullable: true
          description: Height in `heightUnit`
        heightUnit:
          type: string
          nullable: true
          description: Unit for `height` (e.g. `cm`, `in`)
        weight:
          type: number
          nullable: true
          description: Weight in `weightUnit`
        weightUnit:
          type: string
          nullable: true
          description: Unit for `weight` (e.g. `kg`, `lb`)
        phone:
          type: string
          nullable: true
        useMetricSystem:
          type: boolean
          description: True if the user prefers metric units
        timeZoneIdentifier:
          type: string
          description: IANA time zone (e.g. `America/New_York`). Use it when interpreting local dates.
        preferredDataSource:
          type: integer
          description: |
            Preferred health data source: 0=Arii, 1=Fitbit, 2=Oura, 3=Withings,
            4=AppleHealth, 5=Garmin, 6=Whoop, 7=BioStrap, 8=Strava, 9=HealthConnect,
            10=Elation, 11=FreeStyleLibre, 12=Cronometer, 13=Mira, 14=Dexcom, 15=Polar,
            16=Omron, 17=HeartMath, 18=InBody, 19=Cerbo, 20=AdvancedMd, 21=OneUpHealth,
            22=JunctionLabReport, 23=Kardia, 24=Peloton, 25=Healthie, 26=Athena,
            27=HeadsUpV1, 28=HumanApi
        preferredDataSourceName:
          type: string
          nullable: true
          description: Human-readable preferred data source (e.g. `Fitbit`). Prefer this over the integer.
        tone:
          type: integer
          description: |
            Preferred AI response tone: 0=ConciseAndFormal, 1=ModerateAndFormal,
            2=LengthyAndFormal, 3=ConciseAndBalanced, 4=ModerateAndBalanced,
            5=LengthyAndBalanced, 6=ConciseAndCasual, 7=ModerateAndCasual, 8=LengthyAndCasual
        isFollowUp:
          type: boolean
          description: Whether the user wants follow-up questions
        shareLocation:
          type: integer
          description: "Location sharing: 0=AllowOnce, 1=AllowWhileUsingApp, 2=NotAllowed"
        isShareAppleHealth:
          type: boolean
          nullable: true
        isShareAppleHealthClinical:
          type: boolean
          nullable: true
        onboardingFlow:
          type: integer
          nullable: true
          description: "0=Provider, 1=TeamMember, 2=PatientViaInvitationToken, 3=PatientViaGroupCode, 4=StandalonePatient"
        allergies:
          type: array
          nullable: true
          description: Known allergies
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              allergy:
                type: integer
                description: Allergy type enum (integer)
              allergyName:
                type: string
                nullable: true
                description: Human-readable allergy name
              otherAllergies:
                type: array
                nullable: true
                items:
                  type: string
              description:
                type: string
                nullable: true
              source:
                type: string
                nullable: true
        dietaryPreferences:
          type: array
          nullable: true
          description: Dietary preferences / restrictions
          items:
            type: object
            properties:
              preference:
                type: integer
                description: Dietary preference enum (integer)
              userDefinedPreferences:
                type: array
                nullable: true
                items:
                  type: string
        goals:
          type: array
          nullable: true
          description: Health goals selected by the user
          items:
            type: object
            properties:
              goalId:
                type: string
                format: uuid
              name:
                type: string
              description:
                type: string
                nullable: true
              userDefinedGoals:
                type: array
                nullable: true
                items:
                  type: string
        preferredDrinkSizes:
          type: array
          items:
            type: integer
          description: Preferred drink sizes in `drinkSizeUnit`
        drinkSizeUnit:
          type: string
        selectedDrinkSizeValue:
          type: number
          nullable: true
        selectedDrinkSizeUnit:
          type: string
          nullable: true

    ActivityDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Activity ID
        activityName:
          type: string
          description: Name of the activity
        durationMinutes:
          type: integer
          description: Duration in minutes
        startTime:
          type: string
          format: date-time
          description: Start time
        intensityLevel:
          type: string
          description: "Intensity: low, medium, or high"
        estimatedCaloriesBurned:
          type: integer
          description: Estimated calories burned
        userId:
          type: string
          format: uuid
          description: |
            Arii user ID (`UserDto.id` GUID) of the user who performed the activity.
            For yourself, use `get_current_user`.id. Never an Airia profile ID.
        source:
          type: string
          description: "Data source (e.g., Garmin, Oura, Strava, Whoop)"

    ActivityUpsertDto:
      type: object
      required: [activityName, durationMinutes, startTime, intensityLevel, estimatedCaloriesBurned, userId]
      properties:
        activityName:
          type: string
          description: Activity name
        durationMinutes:
          type: integer
          description: Duration in minutes (minimum 1)
          minimum: 1
        startTime:
          type: string
          format: date-time
          description: Start time (ISO 8601)
        intensityLevel:
          type: string
          description: "Must be: low, medium, or high"
          enum: [low, medium, high]
        estimatedCaloriesBurned:
          type: integer
          description: Estimated calories burned (minimum 0)
          minimum: 0
        userId:
          type: string
          format: uuid
          description: |
            Arii user ID (`UserDto.id` GUID) that this record belongs to. For yourself,
            use `get_current_user`.id. Never an Airia profile ID (`airiaProfileId`) or
            Keycloak `sub` — a wrong ID kind writes to the wrong record or 404s.

    GoalDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Goal ID
        name:
          type: string
          description: Goal display name
        description:
          type: string
          description: Goal description

    GoalUpsertDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Goal name (max 100 chars)
          maxLength: 100
        description:
          type: string
          description: Goal description (max 300 chars)
          maxLength: 300

    JournalDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Journal entry ID
        userId:
          type: string
          format: uuid
          description: |
            Arii user ID (`UserDto.id` GUID) that this record belongs to. For yourself,
            use `get_current_user`.id. Never an Airia profile ID (`airiaProfileId`) or
            Keycloak `sub` — a wrong ID kind writes to the wrong record or 404s.
        title:
          type: string
          description: Journal title
        content:
          type: string
          description: Journal content
        journalDate:
          type: string
          format: date-time
          description: Date of the journal event
        imageUrls:
          type: array
          items:
            type: string
          description: URLs of attached images
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JournalUpsertDto:
      type: object
      required: [userId, journalDate]
      properties:
        userId:
          type: string
          format: uuid
          description: |
            Arii user ID (`UserDto.id` GUID) that this record belongs to. For yourself,
            use `get_current_user`.id. Never an Airia profile ID (`airiaProfileId`) or
            Keycloak `sub` — a wrong ID kind writes to the wrong record or 404s.
        title:
          type: string
          description: Journal title
        content:
          type: string
          description: Journal content
        journalDate:
          type: string
          format: date-time
          description: Date of the journal event (ISO 8601)

    MealDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Meal ID
        name:
          type: string
          description: Meal name
        description:
          type: string
          description: Meal description
        date:
          type: string
          format: date-time
          description: Meal date
        portionSize:
          type: integer
          description: Number of servings
        servingSizeImperial:
          type: number
          description: Imperial serving size
        servingUnitImperial:
          type: string
          description: Imperial serving unit
        servingSizeMetric:
          type: number
          description: Metric serving size
        servingUnitMetric:
          type: string
          description: Metric serving unit

    MealUpsertDto:
      type: object
      properties:
        name:
          type: string
          description: Meal name
        description:
          type: string
          description: Meal description
        date:
          type: string
          format: date-time
          description: Meal date (ISO 8601)
        portionSize:
          type: integer
          description: Number of servings
        servingSizeImperial:
          type: number
          description: Imperial serving size
        servingUnitImperial:
          type: string
          description: Imperial serving unit
        servingSizeMetric:
          type: number
          description: Metric serving size
        servingUnitMetric:
          type: string
          description: Metric serving unit
        userIds:
          type: array
          items:
            type: string
            format: uuid
          description: User IDs to associate with this meal

    NoteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Note ID
        title:
          type: string
          description: Note title
        date:
          type: string
          format: date-time
          description: Note date
        content:
          type: string
          description: Note content (may be HTML or plain text)
        private:
          type: boolean
          description: Whether the note is private
        archived:
          type: boolean
          description: Whether the note is archived
        isDraft:
          type: boolean
          description: Whether this is a draft
        createdBy:
          type: string
          format: uuid
          description: Creator user ID
        tenantId:
          type: string
          format: uuid
          description: Tenant/organization ID
        patientIds:
          type: array
          items:
            type: string
            format: uuid
          description: Associated patient IDs
        categories:
          type: array
          items:
            type: string
          description: Category names
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NoteUpsertDto:
      type: object
      required: [tenantId, title, date]
      properties:
        tenantId:
          type: string
          format: uuid
          description: Tenant/organization ID
        noteTemplateId:
          type: string
          format: uuid
          description: Template ID (if created from template)
        title:
          type: string
          description: Note title (max 255 chars)
          maxLength: 255
        date:
          type: string
          format: date-time
          description: Note date (ISO 8601)
        content:
          type: string
          description: Note content
        private:
          type: boolean
          description: Whether the note is private
        patientIds:
          type: array
          items:
            type: string
            format: uuid
          description: Patient IDs to associate

    PagedNotes:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteDto"
        totalCount:
          type: integer
          description: Total items across all pages
        pageNumber:
          type: integer
          description: Current page (0-based)
        pageSize:
          type: integer
          description: Items per page
        totalPages:
          type: integer
        hasNextPage:
          type: boolean

    ObservationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Observation ID
        type:
          type: string
          description: "Observation type: Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery"
        subType:
          type: string
          description: Observation sub-type
        date:
          type: string
          format: date-time
          description: |
            Observation date. List order is undocumented — sort by this field
            descending to find the newest panel, and always report it with values.
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        source:
          type: string
          description: Data source
        annotations:
          type: string
          description: Additional annotations
        userId:
          type: string
          format: uuid
          description: |
            Arii user ID (`UserDto.id` GUID) that this record belongs to. For yourself,
            use `get_current_user`.id. Never an Airia profile ID (`airiaProfileId`) or
            Keycloak `sub` — a wrong ID kind writes to the wrong record or 404s.
        tenantId:
          type: string
          format: uuid
          description: Tenant ID
        metadata:
          type: object
          description: Arbitrary metadata key-value pairs
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization
        sampleCount:
          type: integer
          description: Count of associated HealthKit samples
        healthKitSamples:
          type: array
          items:
            type: object
          description: |
            Quantity samples carrying numeric lab/device values. Present only when
            `includeHealthKitSamples=true` (avoid enabling). For current lab values
            use `get_marker_summary` with `specificMarkers`, not this array.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ObservationCreateDto:
      type: object
      required: [type, date, source]
      properties:
        type:
          type: string
          description: "Observation type: Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery"
          enum: [Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery]
        subType:
          type: string
          description: Observation sub-type (max 255 chars)
        date:
          type: string
          format: date-time
          description: Observation date (ISO 8601)
        startDate:
          type: string
          format: date-time
          description: Start date of the observation period
        endDate:
          type: string
          format: date-time
          description: End date of the observation period
        source:
          type: string
          description: "Data source (max 100 chars, e.g., Oura, Fitbit, Manual)"
        annotations:
          type: string
          description: Additional annotations (max 255 chars)
        userId:
          type: string
          format: uuid
          description: |
            Arii user ID (`UserDto.id` GUID) the observation is recorded against. Omit to
            default to the authenticated caller. If setting it explicitly, use
            `get_current_user`.id for yourself — never an Airia profile ID, which would
            attach the observation to the wrong record or fail.
        tenantId:
          type: string
          format: uuid
          description: Tenant ID
        metadata:
          type: object
          description: Arbitrary metadata key-value pairs
        tags:
          type: array
          items:
            type: string
        healthKitQuantitySamples:
          type: array
          description: |
            Nested measurement samples. Each item needs `markerTypeId`, `recordDate`,
            `value`, and `unit` so a numeric result is actually recorded.
          items:
            type: object
            required: [markerTypeId, value, unit]
            properties:
              markerTypeId:
                type: string
                format: uuid
                description: Marker type ID for this sample. Resolve names via bulk_search_marker_types.
              recordDate:
                type: string
                format: date
                description: Local calendar date for this sample (YYYY-MM-DD).
              value:
                type: number
                description: The numeric measurement value.
              unit:
                type: string
                description: Unit of the value (e.g. mg/dL, bpm, steps).
              startDate:
                type: string
                format: date-time
                description: Sample interval start, if the API uses a window rather than a single recordDate.
              endDate:
                type: string
                format: date-time
                description: Sample interval end.

    PagedObservations:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObservationDto"
        totalCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean

    MarkerTypeUpsertDto:
      type: object
      required: [name, type, category]
      properties:
        name:
          type: string
          description: Name of the marker type.
        type:
          type: string
          description: The marker's data type label (e.g., Lab, Vital).
        altNames:
          type: array
          items:
            type: string
          description: Alternative names/synonyms for the marker type.
        category:
          type: string
          description: Category of the marker type.
        unitSI:
          type: string
          description: SI unit for the marker type.
        unitConventional:
          type: string
          description: Conventional unit for the marker type.
        factorConvToSI:
          type: number
          description: Conversion factor from conventional to SI units.
        acceptableUnits:
          type: array
          items:
            type: string
          description: Acceptable units for the marker type.
        tenantId:
          type: string
          format: uuid
          description: Tenant/Group ID (GUID) that owns this marker type. Omit for a system/default marker type.
        loinc:
          type: string
          description: LOINC code for the marker type.
        snomed:
          type: string
          description: SNOMED code for the marker type.
        decimalPrecision:
          type: integer
          description: Decimal precision for numeric values.
        textValue:
          type: boolean
          description: Whether this marker uses text (non-numeric) values.
        systemReferenceRanges:
          type: array
          description: System reference ranges to create for this marker type.
          items:
            $ref: "#/components/schemas/SystemReferenceRangeUpsertDto"
        tags:
          type: array
          items:
            type: string
          description: Tags for the marker type.

    SystemReferenceRangeUpsertDto:
      type: object
      required: [type, unit]
      properties:
        type:
          type: string
          description: The type of the reference range.
        unit:
          type: string
          description: The unit of the reference range.
        segments:
          type: array
          description: Range segments within the system reference range.
          items:
            type: object
            properties:
              min:
                type: number
                description: Minimum value of the range.
              max:
                type: number
                description: Maximum value of the range.
              operator:
                type: string
                description: 'Operator for the range (e.g., "<", ">", "=").'
              label:
                type: string
                description: Display label of the segment.
              gender:
                type: string
                description: 'Gender this segment applies to (e.g., "Male", "Female").'

    MedicationScheduleDto:
      type: object
      required: [scheduleType]
      description: |
        Dosing schedule that generates the forward dose log. Without a valid
        schedule, `get_medication_history` stays empty. Shape taken from the
        Arii POST /api/v1/Medications/user/{userId} request body.
      properties:
        scheduleType:
          type: string
          description: |
            How doses repeat. Values seen on the API: SpecificDays, EveryFewDays, OnCycle.
          enum: [SpecificDays, EveryFewDays, OnCycle]
        doseTimes:
          type: array
          description: Clock times and dose counts for each administration.
          items:
            type: object
            required: [time]
            properties:
              time:
                type: string
                description: Clock time for the dose (e.g. "08:00").
              numberOfDoses:
                type: integer
                description: Number of doses at this time.
        duration:
          type: object
          description: Inclusive schedule window.
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
        sendReminders:
          type: boolean
        daysBetweenDoses:
          type: integer
          description: Used when scheduleType is EveryFewDays.
        selectedDays:
          type: array
          description: Weekdays for SpecificDays (typically 0-6).
          items:
            type: integer
        cycleConfiguration:
          type: object
          description: Used when scheduleType is OnCycle.
          properties:
            cycleUnit:
              type: integer
            useForValue:
              type: integer
            pauseForValue:
              type: integer

    UserProductHistoryLogDto:
      type: object
      description: |
        One scheduled dose from user-product history. Fields named from the AIP-175
        catalog; the live DTO may include additional properties.
      properties:
        scheduledDate:
          type: string
          format: date-time
          description: When the dose was scheduled.
        scheduledTime:
          type: string
          description: Scheduled clock time, when the API returns it separately from scheduledDate.
        doseCount:
          type: number
          description: Dose count for this log entry.
        status:
          type: string
          description: taken, missed, skipped, or other API status values.
        takenAt:
          type: string
          format: date-time
          description: When the dose was actually taken, if recorded.
        scheduleType:
          type: string
          description: Schedule type for this medication.
        instructions:
          type: string
          description: Dosing instructions.

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
      description: |
        API Key via X-API-Key. Some older endpoints may auto-translate Airia profile IDs
        to Arii user IDs under API Key auth only. Prefer explicit Arii user IDs; several
        newer endpoints do not support API Key at all.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer (including Airia Platform passthrough). Requires Arii user IDs in all
        user-scoped parameters — no Airia-profile→Arii-user auto-translation.
