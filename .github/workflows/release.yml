name: "Release"

run-name: "Release ${{ inputs.ref || 'main' }} · ${{ inputs.dry_run && 'dry run' || 'for real' }} · by:${{ github.actor }}"

# Tags the arii.yaml that was uploaded to the Arii MCP catalog, and publishes it as a GitHub Release.
#
# The spec is uploaded by hand, and one catalog serves dev, staging and prod, so an upload is live
# everywhere at once. Until now nothing marked which commit was uploaded, so the spec could not be
# checked out exactly as it went out. Run this after an upload:
#
#   - it reads the version in arii.yaml at `ref` (default: main) and tags that commit v<version>;
#   - it publishes the GitHub Release v<version>. Its notes are built from git, not written by hand:
#     the spec version since the last published release (for example 3.1.0 → 7.1.0) and the title
#     of every PR merged in between, then a "Deployed:" line to fill in with the upload date.
#     `since` names the older commit or tag to compare with instead; with no earlier release and
#     no `since`, the notes list every PR up to the commit.
#
# A dry run (the default) reads the version, shows the release notes it would publish, and creates
# neither tag nor release.
#
# Idempotent: a tag that already points at the commit is kept, and a release that exists is left as
# it is. A tag of the same version on another commit stops the run, because a version names one spec.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show the tag and release notes it would create, and create nothing."
        required: false
        type: boolean
        default: true
      ref:
        description: "The commit that was uploaded: a SHA, or main. Its arii.yaml version names the release."
        required: false
        type: string
        default: main
      since:
        description: "Optional: the older commit or tag the release notes compare with. Empty means the last published release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the commit and its version
        id: version
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --verify --quiet "${REF:-main}^{commit}" || git rev-parse --verify --quiet "origin/${REF:-main}^{commit}" || true)
          [ -n "$SHA" ] || { echo "::error::'$REF' is not a commit in this repository."; exit 1; }
          VERSION=$(git show "$SHA:arii.yaml" | awk '/^info:/{i=1} i && /^  version:/{gsub(/"/,"",$2); print $2; exit}')
          [ -n "$VERSION" ] || { echo "::error::No info.version in arii.yaml at $SHA."; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing arii.yaml $VERSION from \`${SHA:0:7}\`." >> "$GITHUB_STEP_SUMMARY"

      # What changed since the last published release (or `since`): the spec version, and every PR
      # merged in between, by the "(#N)" a squash merge leaves in its subject.
      - name: Build the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          if [ -z "$SINCE" ]; then
            # The newest published release other than this one.
            SINCE=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | grep -vx "$TAG" | sort -V | tail -1 || true)
          fi
          if [ -n "$SINCE" ] && ! git rev-parse --verify --quiet "$SINCE^{commit}" >/dev/null; then
            echo "::error::'$SINCE' is not a commit or tag in this repository."
            exit 1
          fi
          {
            if [ -n "$SINCE" ]; then
              OLD=$(git show "$SINCE:arii.yaml" 2>/dev/null | awk '/^info:/{i=1} i && /^  version:/{gsub(/"/,"",$2); print $2; exit}')
              echo "arii.yaml ${OLD:-?} → $VERSION. Changes since $SINCE."
              RANGE="$SINCE..$SHA"
            else
              echo "arii.yaml $VERSION. First release: every change up to it."
              RANGE="$SHA"
            fi
            echo ""
            echo "### Pull requests"
            PRS=$(git log --first-parent --format=%s "$RANGE" | grep -E '\(#[0-9]+\)$' | sed 's/^/- /' || true)
            echo "${PRS:-- None.}"
            echo ""
            echo "---"
            echo "Deployed: — (fill in the date it was uploaded to the Arii MCP catalog)"
          } > "$RUNNER_TEMP/notes.md"

      - name: What a real run would create (dry run)
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          if EXISTING=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            [ "$EXISTING" = "$SHA" ] && STATE="already names this commit" || STATE="names ${EXISTING:0:7}, so a real run would stop"
          else
            STATE="would be created on ${SHA:0:7}"
          fi
          {
            echo "### Dry run: $TAG"
            echo ""
            echo "Tag: $STATE."
            echo ""
            echo "Release notes:"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/notes.md"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tag the commit, unless already tagged
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          if EXISTING=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            if [ "$EXISTING" != "$SHA" ]; then
              echo "::error::$TAG already names ${EXISTING:0:7}, not ${SHA:0:7}. A version names one spec: raise the version, or release the commit $TAG already names."
              exit 1
            fi
            echo "$TAG already names this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "arii.yaml $TAG, as uploaded to the Arii MCP catalog"
          git push origin "$TAG"

      - name: Publish the release, unless it exists
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The $TAG release already exists; left as it is."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          echo "Published $TAG." >> "$GITHUB_STEP_SUMMARY"
