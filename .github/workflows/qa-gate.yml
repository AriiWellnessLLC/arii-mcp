# Checks that the test work for this pull request's Jira ticket actually happened: the ticket
# carries a stamp written by /tests:implement, and the matching pull request in
# arii-automation-qe has a green flow-catalog-gate. What passes, what fails, and how to fix each
# failure is in the action's README:
# https://github.com/AriiWellnessLLC/infra-pipelines/tree/main/actions/qa-gate
#
# Until 2026-10-10 this only warns: a failing verdict still reports green and says "would block".
# On a pull request the check judges wrongly, add the label `qa-gate-override` and comment one
# line saying why. Every override is posted to Slack, so skipping the gate stays visible.
#
# This repository could not use the gate while it was public: GitHub does not let a public
# repository resolve an action from an internal or private one, and the first attempt on
# 2026-09-26 died with `Unable to resolve action ariiwellnessllc/infra-pipelines, not found`.
# It became private on 2026-09-28, infra-pipelines shares its actions org-wide, and the
# APP_INFRA secrets (scoped "private and internal") now reach here — so no repo-level read
# token is needed.
name: qa-gate

# The trigger list is wide because the answer can change without a push: the Jira key can be
# typed into the title or body, and the override label added, after the pull request is opened.
#
# No `paths:` filter, deliberately. This check is meant to become required, and a required check
# whose workflow is skipped never reports at all, which blocks the pull request forever. The job
# always runs and decides for itself whether there is product code to judge.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  # An override's reason is written as a comment, and a comment fires `issue_comment`, not
  # `pull_request` — without this the reason arrives after the last event that could read it and
  # the override stands as "no reason given" for ever. The job below runs on a comment only when
  # it is on a pull request and starts with the override prefix, so ordinary review chatter costs
  # nothing.
  issue_comment:
    types: [created, edited]

# Keyed by workflow as well as branch: the group name is global to the repository, so a bare
# `head_ref` would put any other branch-keyed workflow in this same group and let the two cancel
# each other's runs.
concurrency:
  # `head_ref` is empty on an `issue_comment` event, so fall back to the pull request number —
  # without it every commented-on pull request would share one empty group key and cancel the
  # others' runs.
  group: ${{ github.workflow }}-${{ github.head_ref || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Job id and name are both `qa-gate` because this exact string becomes the required status
  # check in the branch ruleset. Renaming either one silently stops the ruleset matching it.
  qa-gate:
    name: qa-gate
    # Skip a comment that is not on a pull request, or not an override reason. A `pull_request`
    # event has no `issue`, so the first clause lets every one of those straight through.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, 'qa-gate-override:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Both are needed: the sticky comment goes through the pull-requests scope, and a pull
      # request's labels are issue labels.
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # One commit is enough. The action lists changed files through the API, never by
          # diffing, and the only thing it reads from the working tree is the head commit's
          # author email — a last-resort fallback when Slack cannot resolve the author any
          # other way.
          fetch-depth: 1

      - uses: AriiWellnessLLC/infra-pipelines/actions/qa-gate@main
        with:
          warn-only: 'true'
          warn-until: '2026-10-10'
          jira-email: ${{ secrets.JIRA_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          slack-bot-token: ${{ secrets.QA_GATE_SLACK_BOT_TOKEN }}
          # Organization variable holding the channel id of #qa_gate. If it is ever empty the
          # gate still writes the pull request comment and the job summary, but posts nothing
          # to Slack.
          slack-channel-id: ${{ vars.QA_GATE_SLACK_CHANNEL_ID }}
          github-app-id: ${{ secrets.APP_INFRA_APP_ID }}
          github-app-private-key: ${{ secrets.APP_INFRA_PRIVATE_KEY }}
